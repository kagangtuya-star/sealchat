name: Cleanup unused GHCR versions

on:
  # 每月 1 日 UTC 03:23，即北京时间 11:23
  schedule:
    - cron: "23 3 1 * *"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "仅预览，不实际删除"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: cleanup-ghcr-sealchat
  cancel-in-progress: false

env:
  PACKAGE_OWNER: kagangtuya-star
  PACKAGE_REPOSITORY: sealchat
  PACKAGE_NAME: sealchat
  KEEP_ZERO_DOWNLOAD_VERSIONS: "30"

jobs:
  cleanup:
    name: Cleanup zero-download versions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install parser dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            requests beautifulsoup4

      - name: Find and delete unused versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: >-
            ${{ github.event_name == 'workflow_dispatch'
                && inputs.dry_run
                || false }}
        run: |
          python <<'PY'
          from __future__ import annotations

          import math
          import os
          import re
          import sys
          import time
          from pathlib import Path
          from typing import Any
          from urllib.parse import quote

          import requests
          from bs4 import BeautifulSoup
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry


          OWNER = os.environ["PACKAGE_OWNER"]
          REPOSITORY = os.environ["PACKAGE_REPOSITORY"]
          PACKAGE = os.environ["PACKAGE_NAME"]
          KEEP_COUNT = int(os.environ["KEEP_ZERO_DOWNLOAD_VERSIONS"])
          TOKEN = os.environ["GH_TOKEN"]
          DRY_RUN = os.environ.get("DRY_RUN", "false").lower() == "true"

          API_VERSION = "2026-03-10"
          API_ROOT = "https://api.github.com"
          WEB_ROOT = "https://github.com"

          # 为安全起见，只清理具有至少一个标签的逻辑镜像版本。
          # untagged 版本可能是多架构镜像的子 manifest 或 provenance。
          TAGGED_ONLY = True

          session = requests.Session()
          retry = Retry(
              total=5,
              connect=5,
              read=5,
              status=5,
              backoff_factor=1,
              status_forcelist=(429, 500, 502, 503, 504),
              allowed_methods=frozenset({"GET", "DELETE"}),
          )
          session.mount("https://", HTTPAdapter(max_retries=retry))

          api_headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": API_VERSION,
              "User-Agent": "sealchat-ghcr-cleanup",
          }

          web_headers = {
              "Accept": "text/html,application/xhtml+xml",
              "Accept-Language": "en-US,en;q=0.9",
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 Chrome/140 Safari/537.36"
              ),
          }

          owner_q = quote(OWNER, safe="")
          package_q = quote(PACKAGE, safe="")

          list_api_url = (
              f"{API_ROOT}/users/{owner_q}/packages/"
              f"container/{package_q}/versions"
          )

          versions_web_url = (
              f"{WEB_ROOT}/{OWNER}/{REPOSITORY}/"
              f"pkgs/container/{PACKAGE}/versions"
          )

          version_href_patterns = (
              re.compile(
                  rf"/{re.escape(OWNER)}/{re.escape(REPOSITORY)}"
                  rf"/pkgs/container/{re.escape(PACKAGE)}/(\d+)"
              ),
              re.compile(
                  rf"/users/{re.escape(OWNER)}/packages/container/"
                  rf"{re.escape(PACKAGE)}/(\d+)"
              ),
          )

          download_pattern = re.compile(
              r"([\d,]+)\s+Version downloads?",
              re.IGNORECASE,
          )


          def fail(message: str) -> None:
              print(f"ERROR: {message}", file=sys.stderr)
              raise SystemExit(1)


          def tags_of(version: dict[str, Any]) -> list[str]:
              return (
                  version.get("metadata", {})
                  .get("container", {})
                  .get("tags", [])
                  or []
              )


          def get_all_api_versions() -> list[dict[str, Any]]:
              versions: list[dict[str, Any]] = []
              page = 1

              while True:
                  response = session.get(
                      list_api_url,
                      headers=api_headers,
                      params={"per_page": 100, "page": page},
                      timeout=30,
                  )

                  if response.status_code != 200:
                      fail(
                          "无法读取 GHCR 版本："
                          f"HTTP {response.status_code}\n{response.text[:1000]}"
                      )

                  batch = response.json()

                  if not isinstance(batch, list):
                      fail("GitHub Packages API 返回了非数组数据。")

                  if not batch:
                      break

                  versions.extend(batch)
                  print(f"REST API 第 {page} 页：读取 {len(batch)} 个版本")

                  if len(batch) < 100:
                      break

                  page += 1

              # API 偶尔可能在分页过程中返回重复项。
              unique = {int(version["id"]): version for version in versions}
              result = list(unique.values())

              result.sort(
                  key=lambda item: item.get("created_at", ""),
                  reverse=True,
              )
              return result


          def id_from_href(href: str) -> int | None:
              for pattern in version_href_patterns:
                  match = pattern.search(href)
                  if match:
                      return int(match.group(1))
              return None


          def ids_inside(element: Any) -> set[int]:
              ids: set[int] = set()

              for link in element.find_all("a", href=True):
                  version_id = id_from_href(str(link.get("href", "")))
                  if version_id is not None:
                      ids.add(version_id)

              return ids


          def parse_download_counts(
              html: str,
          ) -> dict[int, int]:
              soup = BeautifulSoup(html, "html.parser")
              result: dict[int, int] = {}

              # 从“0 Version downloads”文本向上寻找其所属版本卡片。
              for text_node in soup.find_all(string=download_pattern):
                  match = download_pattern.search(str(text_node))

                  if not match:
                      continue

                  downloads = int(match.group(1).replace(",", ""))

                  for parent in text_node.parents:
                      if getattr(parent, "name", None) in {"body", "html"}:
                          break

                      version_ids = ids_inside(parent)

                      # 一个版本可能有多个 tag 链接，但它们的版本 ID 相同。
                      if len(version_ids) == 1:
                          version_id = next(iter(version_ids))

                          previous = result.get(version_id)
                          if previous is not None and previous != downloads:
                              fail(
                                  f"版本 {version_id} 得到了冲突的下载量："
                                  f"{previous} 与 {downloads}"
                              )

                          result[version_id] = downloads
                          break

              return result


          def get_all_download_counts(
              expected_version_count: int,
          ) -> dict[int, int]:
              all_counts: dict[int, int] = {}
              page = 1

              # GitHub 当前每页约 50 个版本；预留额外页数。
              max_pages = max(
                  10,
                  math.ceil(expected_version_count / 20) + 5,
              )

              while page <= max_pages:
                  response = session.get(
                      versions_web_url,
                      headers=web_headers,
                      params={"page": page},
                      timeout=30,
                  )

                  if response.status_code != 200:
                      fail(
                          f"无法读取 Package 网页第 {page} 页："
                          f"HTTP {response.status_code}"
                      )

                  page_counts = parse_download_counts(response.text)
                  new_ids = set(page_counts) - set(all_counts)

                  print(
                      f"网页第 {page} 页：解析 {len(page_counts)} 个版本，"
                      f"新增 {len(new_ids)} 个"
                  )

                  if not new_ids:
                      break

                  all_counts.update(page_counts)

                  if len(all_counts) >= expected_version_count:
                      break

                  page += 1
                  time.sleep(0.3)

              return all_counts


          def delete_version(version_id: int) -> None:
              delete_url = (
                  f"{API_ROOT}/users/{owner_q}/packages/container/"
                  f"{package_q}/versions/{version_id}"
              )

              response = session.delete(
                  delete_url,
                  headers=api_headers,
                  timeout=30,
              )

              if response.status_code == 204:
                  return

              # 分页与删除之间版本可能已被其他任务移除。
              if response.status_code == 404:
                  print(f"版本 {version_id} 已不存在，跳过。")
                  return

              fail(
                  f"删除版本 {version_id} 失败："
                  f"HTTP {response.status_code}\n{response.text[:1000]}"
              )


          versions = get_all_api_versions()

          if not versions:
              print("Package 中没有活动版本。")
              raise SystemExit(0)

          print(f"REST API 共发现 {len(versions)} 个活动版本。")

          download_counts = get_all_download_counts(len(versions))
          print(f"网页共解析 {len(download_counts)} 个版本下载量。")

          tagged_versions = [
              version for version in versions if tags_of(version)
          ]
          covered_tagged = sum(
              1 for version in tagged_versions
              if int(version["id"]) in download_counts
          )

          coverage = (
              covered_tagged / len(tagged_versions)
              if tagged_versions
              else 1.0
          )

          print(
              f"有标签版本解析覆盖率："
              f"{covered_tagged}/{len(tagged_versions)} "
              f"({coverage:.1%})"
          )

          # 网页结构变化时停止运行，防止错误删除。
          if coverage < 0.90:
              fail(
                  "下载量解析覆盖率低于 90%，可能是 GitHub 网页结构发生变化；"
                  "本次不会删除任何版本。"
              )

          zero_download_versions: list[dict[str, Any]] = []

          for version in versions:
              version_id = int(version["id"])
              downloads = download_counts.get(version_id)

              if downloads != 0:
                  continue

              if TAGGED_ONLY and not tags_of(version):
                  continue

              zero_download_versions.append(version)

          zero_download_versions.sort(
              key=lambda item: item.get("created_at", ""),
              reverse=True,
          )

          kept_versions = zero_download_versions[:KEEP_COUNT]
          delete_versions = zero_download_versions[KEEP_COUNT:]

          print()
          print(
              f"下载量为 0 的有标签版本："
              f"{len(zero_download_versions)}"
          )
          print(f"保留最近版本：{len(kept_versions)}")
          print(f"待删除旧版本：{len(delete_versions)}")
          print(f"运行模式：{'仅预览' if DRY_RUN else '实际删除'}")
          print()

          for version in delete_versions:
              version_id = int(version["id"])
              created_at = version.get("created_at", "")
              digest = version.get("name", "")
              tags = ", ".join(tags_of(version))

              print(
                  f"{'[预览]' if DRY_RUN else '[删除]'} "
                  f"id={version_id} "
                  f"created={created_at} "
                  f"tags=[{tags}] "
                  f"name={digest}"
              )

              if not DRY_RUN:
                  delete_version(version_id)
                  time.sleep(0.2)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          if summary_path:
              with Path(summary_path).open(
                  "a",
                  encoding="utf-8",
              ) as summary:
                  summary.write("## GHCR 清理结果\n\n")
                  summary.write(
                      f"- Package：`ghcr.io/{OWNER}/{PACKAGE}`\n"
                  )
                  summary.write(
                      f"- 活动版本总数：{len(versions)}\n"
                  )
                  summary.write(
                      f"- 下载量为 0 的有标签版本："
                      f"{len(zero_download_versions)}\n"
                  )
                  summary.write(
                      f"- 保留：{len(kept_versions)}\n"
                  )
                  summary.write(
                      f"- {'计划删除' if DRY_RUN else '已删除'}："
                      f"{len(delete_versions)}\n"
                  )
                  summary.write(
                      f"- 模式："
                      f"{'Dry run' if DRY_RUN else 'Delete'}\n"
                  )

          print()
          print("清理完成。")
          PY
