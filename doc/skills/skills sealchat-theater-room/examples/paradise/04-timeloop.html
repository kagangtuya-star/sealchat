<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><!-- 跟随宿主 iframe 的配色方案，避免浏览器在 iframe 后垫不透明底色 -->
<title>乐园 · 时牢</title>
<!--
  《乐园》时牢核心 —— 同一个 iForm 在舞台上放两次：
    · 小尺寸（宽 < 800px，建议 420×600，开启交互）→ 巡历控制台：显示巡/场景，GM 可操作。
    · 铺满舞台（关闭交互，置于最上层）→ 时牢特效层：所有人同步看到场景横幅、时牢发动、惨剧、谜团、高潮、结局。
  两者属于同一个 iForm，因此共享 Embed Storage（状态）与 Events（特效）。
  iForm 需启用 Embed API，能力：storage.read / storage.write / events.subscribe / events.publish / permissions.read。
  本地预览：?role=console 或 ?role=overlay；?gm=0 模拟玩家视角。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><!-- 非阻塞加载：字体源不可达时先用系统字体渲染 -->
<style>
  :root {
    --ink: #2a2238; --paper: #fbf1e2; --paper2: #f3e4cc; --red: #e0453a; --blood: #c8243a; --violet: #5d4a8a; --gold: #f4c56a; --moon: #eef2fb; --night: #0b0d22;
    --brush: "Ma Shan Zheng", "STXingkai", "KaiTi", serif;
    --chalkf: "Zhi Mang Xing", "Ma Shan Zheng", "KaiTi", cursive;
    --pop: "ZCOOL KuaiLe", "Noto Serif SC", sans-serif;
    --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font-family: var(--serif); color: var(--ink); }
  button { font: inherit; color: inherit; cursor: pointer; }
  .abs { position: absolute; }
  [hidden] { display: none !important; }

  /* ================= 控制台 ================= */
  #console { position: fixed; inset: 0; display: grid; place-items: center; font-size: clamp(11px, 2.6vmin, 18px); }
  .card { position: relative; width: min(100% - 1.2em, 30em); max-height: calc(100% - 1.2em); overflow: auto; scrollbar-width: none; padding: 1.2em 1.3em 1.1em; border-radius: .9em;
    background: linear-gradient(170deg, var(--paper), var(--paper2)); box-shadow: 0 .8em 2em rgba(30,16,40,.45), inset 0 0 0 .3em var(--paper), inset 0 0 0 .38em rgba(42,34,56,.35); }
  .card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: .55em; background: repeating-linear-gradient(90deg, var(--red) 0 1.4em, var(--paper) 1.4em 1.6em, var(--gold) 1.6em 3em, var(--paper) 3em 3.2em, var(--violet) 3.2em 4.6em, var(--paper) 4.6em 4.8em); border-radius: .9em .9em 0 0; }
  .hdr { display: flex; align-items: center; justify-content: space-between; font-size: .72em; letter-spacing: .35em; color: rgba(42,34,56,.6); margin-top: .3em; }
  .sync { display: inline-flex; align-items: center; gap: .4em; letter-spacing: .1em; }
  .sync i { width: .6em; height: .6em; border-radius: 50%; background: #9b9; box-shadow: 0 0 0 .2em rgba(120,180,120,.2); }
  .sync.off i { background: #c99; box-shadow: 0 0 0 .2em rgba(200,120,120,.2); }
  .top { display: flex; align-items: center; gap: 1em; margin: .7em 0 .2em; }
  .tally { width: 4.6em; height: 4.6em; flex: none; border-radius: .4em; background: rgba(42,34,56,.06); padding: .45em; }
  .tally path { fill: none; stroke: rgba(42,34,56,.14); stroke-width: 9; stroke-linecap: round; transition: stroke .5s; }
  .tally path.on { stroke: var(--ink); }
  .tally path.doom { stroke: var(--blood); }
  .big { font-family: var(--brush); font-size: 2.9em; line-height: 1.05; letter-spacing: .06em; }
  .date { font-size: .9em; letter-spacing: .3em; color: var(--red); }
  .dialwrap { display: flex; align-items: center; gap: 1em; margin-top: .4em; }
  .dial { width: 8.6em; height: 8.6em; flex: none; }
  .dial .hand { transform-origin: 0 0; transition: rotate .9s cubic-bezier(.3,1.6,.4,1); }
  .scn b { display: block; font-family: var(--brush); font-weight: 400; font-size: 1.7em; letter-spacing: .08em; }
  .scn span { font-size: .85em; color: rgba(42,34,56,.65); letter-spacing: .18em; }
  .gm { margin-top: .9em; padding-top: .8em; border-top: 1px dashed rgba(42,34,56,.3); display: grid; gap: .5em; }
  .gm h4 { margin: .2em 0 0; font-size: .66em; letter-spacing: .4em; color: rgba(42,34,56,.5); font-weight: 400; }
  .gm .r { display: flex; flex-wrap: wrap; gap: .4em; }
  .b { flex: 1 1 auto; min-width: 4.5em; border: 1px solid rgba(42,34,56,.45); background: rgba(255,255,255,.45); border-radius: .45em; padding: .45em .6em; font-size: .82em; letter-spacing: .1em; transition: background .2s, color .2s, transform .1s; }
  .b:hover { background: var(--ink); color: var(--paper); }
  .b:active { transform: scale(.96); }
  .b.red { border-color: var(--red); color: var(--red); } .b.red:hover { background: var(--red); color: var(--paper); }
  .b.vio { border-color: var(--violet); color: var(--violet); } .b.vio:hover { background: var(--violet); color: var(--paper); }
  .b:disabled { opacity: .35; pointer-events: none; }
  .b.arm { background: var(--blood); color: var(--paper); border-color: var(--blood); }
  .note { margin-top: .7em; font-size: .7em; color: rgba(42,34,56,.55); line-height: 1.6; }

  /* ================= 特效层 ================= */
  #overlay { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 50% 50%; }
  .fx { position: absolute; inset: 0; }
  .fill { position: absolute; inset: 0; }
  .center { position: absolute; left: 50%; top: 50%; translate: -50% -50%; }

  /* 场景横幅 */
  .ribbon { left: 960px; top: 790px; translate: -50% -50%; display: flex; align-items: center; }
  .ribbon .body { white-space: nowrap; position: relative; padding: 18px 90px 20px; background: var(--paper); color: var(--ink); text-align: center; box-shadow: 0 12px 30px rgba(30,16,40,.35);
    clip-path: inset(0 50% 0 50%); animation: unroll .7s cubic-bezier(.6,0,.2,1) forwards, roll .5s ease-in 3.4s forwards; }
  .ribbon .body::before, .ribbon .body::after { content: ""; position: absolute; top: 8px; bottom: 8px; width: 3px; background: var(--red); }
  .ribbon .body::before { left: 40px; } .ribbon .body::after { right: 40px; }
  .ribbon .main { font-family: var(--brush); font-size: 64px; line-height: 1.1; letter-spacing: .12em; opacity: 0; animation: fadeup .6s ease .45s forwards; }
  .ribbon .main em { font-style: normal; color: var(--red); }
  .ribbon .sub { font-size: 22px; letter-spacing: .5em; color: rgba(42,34,56,.6); opacity: 0; animation: fadeup .6s ease .65s forwards; }
  .ribbon .tail { width: 70px; height: 76px; background: var(--red); opacity: 0; animation: fadein .3s ease .5s forwards, fadeout .3s ease 3.4s forwards; }
  .ribbon .tail.l { clip-path: polygon(0 0, 100% 12%, 100% 88%, 0 100%, 26% 50%); margin-right: -8px; }
  .ribbon .tail.r { clip-path: polygon(0 12%, 100% 0, 74% 50%, 100% 100%, 0 88%); margin-left: -8px; }
  .ribbon.night .body { background: #141634; color: var(--moon); } .ribbon.night .sub { color: rgba(238,242,251,.6); }
  @keyframes unroll { to { clip-path: inset(0 0 0 0) } }
  @keyframes roll { to { clip-path: inset(0 50% 0 50%); opacity: 0 } }
  @keyframes fadeup { from { opacity: 0; translate: 0 12px } to { opacity: 1; translate: 0 0 } }
  @keyframes fadein { to { opacity: 1 } }
  @keyframes fadeupc { from { opacity: 0; translate: -50% calc(-50% + 14px) } to { opacity: 1; translate: -50% -50% } }
  @keyframes fadeout { to { opacity: 0 } }

  /* 时牢发动 */
  .rw-veil { background: radial-gradient(ellipse at center, rgba(28,18,52,.74) 0%, rgba(12,7,28,.95) 75%); opacity: 0; animation: fadein .8s ease forwards, fadeout 1s ease 6.6s forwards; }
  .rw-clock { width: 900px; height: 900px; opacity: 0; animation: clockin 1s ease .3s forwards, fadeout .4s ease 3.5s forwards; }
  .rw-clock .hh { transform-origin: 0 0; animation: spinback 3.2s cubic-bezier(.5,0,.9,.6) .4s forwards; }
  .rw-clock .mh { transform-origin: 0 0; animation: spinback2 3.2s cubic-bezier(.5,0,.9,.6) .4s forwards; }
  @keyframes clockin { from { opacity: 0; scale: 1.25 } to { opacity: 1; scale: 1 } }
  @keyframes spinback { to { rotate: -720deg } }
  @keyframes spinback2 { to { rotate: -8640deg } }
  .rw-ring { border-radius: 50%; border: 2px solid rgba(238,242,251,.55); width: 2200px; height: 2200px; opacity: 0; animation: implode 1.4s cubic-bezier(.6,0,.9,.5) forwards; }
  @keyframes implode { 0% { scale: 1; opacity: 0 } 20% { opacity: .9 } 100% { scale: 0; opacity: 0 } }
  .rw-time { font-family: var(--serif); font-weight: 900; font-size: 150px; letter-spacing: .06em; color: var(--moon); opacity: 0; text-shadow: -4px 0 rgba(255,40,90,.6), 4px 0 rgba(40,220,255,.6); animation: fadein .3s ease 1s forwards, fadeout .2s ease 3.5s forwards; top: 540px; }
  .rw-flash { background: #fff; opacity: 0; animation: flash 1.2s ease 3.55s forwards; }
  @keyframes flash { 0% { opacity: 0 } 8% { opacity: 1 } 100% { opacity: 0 } }
  .rw-date { top: 430px; font-size: 48px; letter-spacing: .6em; text-indent: .6em; color: var(--moon); opacity: 0; white-space: nowrap; animation: glitchin 1.2s steps(12) 4s forwards, fadeout .8s ease 6.6s forwards; }
  @keyframes glitchin { 0% { opacity: 0; text-shadow: -18px 0 rgba(255,40,90,.8), 18px 0 rgba(40,220,255,.8) } 40% { opacity: 1 } 100% { opacity: 1; text-shadow: -2px 0 rgba(255,40,90,.5), 2px 0 rgba(40,220,255,.5) } }
  .rw-round { top: 640px; display: flex; align-items: center; gap: 36px; opacity: 0; animation: stampin .5s cubic-bezier(.5,0,.6,1.5) 4.7s forwards, fadeout .8s ease 6.6s forwards; }
  .rw-round .t { font-family: var(--brush); font-size: 150px; color: var(--paper); line-height: 1; letter-spacing: .06em; }
  .rw-round svg { width: 170px; height: 170px; }
  .rw-round path { fill: none; stroke: rgba(251,241,226,.18); stroke-width: 9; stroke-linecap: round; }
  .rw-round path.on { stroke: var(--paper); } .rw-round path.new { stroke: var(--red); stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw .7s ease 5.3s forwards; }
  .rw-round path.doom { stroke: var(--blood); }
  @keyframes draw { to { stroke-dashoffset: 0 } }
  @keyframes stampin { from { opacity: 0; scale: 1.8 } to { opacity: 1; scale: 1 } }
  .petal { position: absolute; width: 14px; height: 18px; border-radius: 80% 0 80% 0; background: #ffc9d6; opacity: 0; }
  .petal.up { animation: rise linear forwards; }
  @keyframes rise { 0% { opacity: 0; translate: 0 0; rotate: 0deg } 10% { opacity: .9 } 100% { opacity: 0; translate: var(--dx) -1300px; rotate: 720deg } }
  .petal.down { background: var(--blood); animation: fall linear forwards; }
  @keyframes fall { 0% { opacity: 0; translate: 0 0; rotate: 0deg } 10% { opacity: .95 } 100% { opacity: 0; translate: var(--dx) 1300px; rotate: -540deg } }

  /* 惨剧 */
  .tg-pulse { box-shadow: inset 0 0 260px 40px rgba(200,36,58,.0); animation: beat 1.1s ease-out 2, fadeout 1.2s ease 4.6s forwards; }
  @keyframes beat { 0% { box-shadow: inset 0 0 260px 40px rgba(200,36,58,0) } 18% { box-shadow: inset 0 0 300px 80px rgba(200,36,58,.75) } 100% { box-shadow: inset 0 0 260px 40px rgba(200,36,58,.25) } }
  .tg-dark { background: radial-gradient(ellipse at 50% 60%, rgba(20,6,12,.35), rgba(20,6,12,.82)); opacity: 0; animation: fadein .8s ease .9s forwards, fadeout 1.2s ease 5.4s forwards; }
  .tg-half { left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
  .tg-half path { fill: none; stroke: var(--blood); stroke-width: 5; stroke-linecap: round; filter: drop-shadow(0 0 6px rgba(200,36,58,.8)); }
  .tg-half .L { transform-box: view-box; transform-origin: 0 540px; animation: taut .9s ease-in-out, snapL 1.6s cubic-bezier(.2,.8,.3,1) .9s forwards; }
  .tg-half .R { transform-origin: 1920px 540px; animation: taut .9s ease-in-out, snapR 1.6s cubic-bezier(.2,.8,.3,1) .9s forwards; }
  @keyframes taut { 0%, 100% { translate: 0 0 } 20% { translate: 0 -3px } 40% { translate: 0 3px } 60% { translate: 0 -2px } 80% { translate: 0 2px } }
  @keyframes snapL { 0% { rotate: 0deg; opacity: 1 } 100% { rotate: 32deg; opacity: 0 } }
  @keyframes snapR { 0% { rotate: 0deg; opacity: 1 } 100% { rotate: -26deg; opacity: 0 } }
  .tg-spark { left: 960px; top: 540px; width: 240px; height: 240px; translate: -50% -50%; border-radius: 50%; background: radial-gradient(circle, #fff 0 4%, rgba(255,120,120,.9) 10%, transparent 60%); scale: 0; animation: spark .6s ease-out .9s forwards; }
  @keyframes spark { 0% { scale: 0; opacity: 1 } 100% { scale: 1.6; opacity: 0 } }
  .tg-lily { left: 960px; top: 720px; width: 760px; height: 760px; translate: -50% -50%; overflow: visible; opacity: 0; animation: fadein .1s linear 1.6s forwards, fadeout 1.2s ease 5.4s forwards; }
  .tg-lily .pt { transform-origin: 0 0; scale: 0; animation: bloom .9s cubic-bezier(.2,1.4,.4,1) forwards; }
  .tg-lily .st { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s ease forwards; }
  @keyframes bloom { to { scale: 1 } }
  .tg-text { left: 1500px; top: 170px; writing-mode: vertical-rl; font-family: var(--brush); font-size: 64px; letter-spacing: .25em; color: #fbe9e6; text-shadow: 0 0 18px rgba(200,36,58,.8); }
  .tg-text span { display: inline-block; opacity: 0; animation: fadein .25s ease forwards; }
  .tg-small { left: 1620px; top: 170px; writing-mode: vertical-rl; font-size: 22px; letter-spacing: .5em; color: rgba(251,233,230,.6); opacity: 0; animation: fadein .8s ease 1.8s forwards; }
  .tg-out { animation: fadeout 1.2s ease 5.6s forwards; }

  /* 谜团公开 */
  .my-veil { background: rgba(22,15,38,.84); opacity: 0; animation: fadein .6s ease forwards, fadeout .8s ease 7.2s forwards; }
  .my-head { top: 230px; font-family: var(--brush); font-size: 92px; letter-spacing: .4em; text-indent: .4em; color: var(--paper); opacity: 0; animation: fadeupc .8s ease .2s forwards, fadeout .8s ease 7.2s forwards; white-space: nowrap; }
  .my-card { top: 360px; width: 400px; height: 520px; perspective: 1400px; }
  .my-card .in { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateY(180deg); animation: flipin 1s cubic-bezier(.3,.2,.2,1) forwards; }
  .my-card .f, .my-card .bk { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 10px; }
  .my-card .bk { transform: rotateY(180deg); background: repeating-linear-gradient(45deg, var(--violet) 0 14px, #4a3a74 14px 28px); box-shadow: inset 0 0 0 10px var(--paper), 0 20px 40px rgba(0,0,0,.4); display: grid; place-items: center; font-family: var(--brush); font-size: 160px; color: var(--paper); }
  .my-card .f { background: var(--paper); box-shadow: inset 0 0 0 10px var(--paper), inset 0 0 0 12px var(--ink), 0 20px 40px rgba(0,0,0,.4); padding: 46px 40px; }
  .my-card .k { display: inline-block; font-size: 18px; letter-spacing: .4em; padding: 4px 14px; background: var(--red); color: var(--paper); border-radius: 30px; }
  .my-card h3 { margin: 22px 0 16px; font-family: var(--brush); font-weight: 400; font-size: 58px; letter-spacing: .1em; }
  .my-card p { margin: 0; font-size: 22px; line-height: 1.8; }
  .my-card .q { position: absolute; right: 26px; bottom: 6px; font-family: var(--brush); font-size: 130px; color: rgba(42,34,56,.08); }
  .my-out { animation: cardout .8s ease 7s forwards; }
  @keyframes flipin { 0% { transform: rotateY(180deg) translateY(120px); opacity: 0 } 30% { opacity: 1 } 100% { transform: rotateY(0) translateY(0); opacity: 1 } }
  @keyframes cardout { to { margin-top: 80px; opacity: 0 } }
  .my-foot { top: 920px; font-size: 22px; letter-spacing: .4em; color: rgba(251,241,226,.7); opacity: 0; animation: fadein .8s ease 2.4s forwards, fadeout .8s ease 7.2s forwards; white-space: nowrap; }

  /* 高潮：时牢破绽 */
  .cl-crack path { fill: none; stroke: rgba(240,246,255,.95); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; filter: drop-shadow(0 0 4px rgba(170,200,255,.9)); animation: draw .9s cubic-bezier(.2,.9,.3,1) forwards; }
  .cl-shard { fill: rgba(200,215,255,.16); stroke: rgba(255,255,255,.55); stroke-width: 1.2; transform-box: fill-box; transform-origin: 50% 50%; animation: shatter 1.8s cubic-bezier(.5,0,.9,.6) forwards; }
  @keyframes shatter { 0% { translate: 0 0; rotate: 0deg; opacity: 1 } 100% { translate: var(--dx) 1300px; rotate: var(--r); opacity: 0 } }
  .cl-moon { background: radial-gradient(ellipse at 50% 18%, rgba(220,230,255,.5), rgba(30,30,90,.78) 42%, rgba(6,6,24,.93) 100%); opacity: 0; animation: fadein 1.2s ease 2.2s forwards, fadeout 1.2s ease 7.2s forwards; }
  .cl-t1 { top: 420px; font-size: 44px; letter-spacing: .7em; text-indent: .7em; color: var(--moon); white-space: nowrap; opacity: 0; animation: fadeupc 1s ease 2.6s forwards, fadeout 1s ease 7.2s forwards; }
  .cl-t2 { top: 570px; font-family: var(--brush); font-size: 190px; line-height: 1; color: var(--moon); white-space: nowrap; opacity: 0; text-shadow: 0 0 40px rgba(170,200,255,.6); animation: stampin .7s cubic-bezier(.5,0,.6,1.4) 3.6s forwards, fadeout 1s ease 7.2s forwards; }
  .cl-t2 em { font-style: normal; color: var(--blood); text-shadow: 0 0 40px rgba(200,36,58,.7); }

  /* 八岐 */
  .or-veil { background: linear-gradient(0deg, rgba(10,4,16,.85), transparent 70%); opacity: 0; animation: fadein .8s ease forwards, fadeout 1s ease 4.8s forwards; }
  .or-snake { position: absolute; bottom: -40px; transform-origin: 50% 100%; translate: 0 110%; animation: snakeup 1.4s cubic-bezier(.2,.9,.3,1) forwards, snakesway 2.2s ease-in-out 1.4s infinite alternate, snakedown 1s ease-in 4.6s forwards; }
  @keyframes snakeup { to { translate: 0 0 } }
  @keyframes snakesway { from { rotate: -3deg } to { rotate: 3deg } }
  @keyframes snakedown { to { translate: 0 110%; opacity: 0 } }
  .or-t { top: 400px; font-family: var(--brush); font-size: 260px; color: var(--blood); text-shadow: 0 0 50px rgba(200,36,58,.8); opacity: 0; animation: stampin .6s cubic-bezier(.5,0,.6,1.4) 1.2s forwards, fadeout 1s ease 4.8s forwards; }

  /* 结局 */
  .en-bg { opacity: 0; animation: fadein 2s ease forwards; }
  .en-bg.flow { background: linear-gradient(0deg, rgba(255,214,160,.92), rgba(255,236,214,.88) 40%, rgba(214,228,255,.85)); }
  .en-bg.eternal { background: radial-gradient(ellipse at center, rgba(120,90,60,.55), rgba(40,28,20,.92)); }
  .cal { left: 960px; top: 470px; width: 420px; height: 520px; translate: -50% -50%; perspective: 1600px; }
  .cal .pg { position: absolute; inset: 0; border-radius: 8px; background: #fffaf1; box-shadow: 0 20px 50px rgba(40,20,40,.35); overflow: hidden; transform-origin: 50% 0; }
  .cal .hd { height: 96px; background: var(--red); color: var(--paper); display: flex; align-items: center; justify-content: center; gap: 18px; font-size: 34px; letter-spacing: .3em; }
  .cal .hd small { font-size: 18px; letter-spacing: .4em; opacity: .85; }
  .cal .n { text-align: center; font-weight: 900; font-size: 270px; line-height: 1.05; color: var(--ink); letter-spacing: -.04em; }
  .cal .e { text-align: center; font-family: var(--pop); font-size: 40px; color: var(--red); letter-spacing: .2em; }
  .cal .pg.tear { animation: tear 1.3s cubic-bezier(.5,0,.7,.4) forwards; }
  @keyframes tear { 0% { transform: none } 25% { transform: rotateX(-24deg) rotateZ(-3deg) } 100% { transform: translate(560px, 900px) rotateZ(48deg) rotateX(-60deg); opacity: 0 } }
  .sepia { filter: sepia(.85) saturate(.6) contrast(.92); transition: filter 2.5s ease; }
  .en-t1 { top: 820px; font-family: var(--brush); font-size: 74px; letter-spacing: .3em; text-indent: .3em; white-space: nowrap; opacity: 0; animation: fadeupc 1.2s ease forwards; }
  .en-t2 { top: 915px; font-size: 26px; letter-spacing: .6em; text-indent: .6em; white-space: nowrap; opacity: 0; animation: fadeupc 1.2s ease forwards; }
  .en-end { left: 1720px; top: 980px; font-family: var(--brush); font-size: 34px; letter-spacing: .3em; opacity: 0; animation: fadein 2s ease forwards; }
  .confetti { position: absolute; top: -40px; width: 14px; height: 22px; animation: conf linear forwards; }
  @keyframes conf { to { translate: var(--dx) 1200px; rotate: var(--r) } }
  .en-tally { left: 1500px; top: 330px; width: 160px; height: 160px; opacity: 0; animation: fadein 1s ease forwards; }
  .en-tally path { fill: none; stroke: rgba(251,241,226,.9); stroke-width: 9; stroke-linecap: round; }
  .en-tally path.doom { stroke: var(--blood); stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 1.4s ease forwards; animation-delay: inherit; }

  /* 常驻：后期巡的不安、高潮的裂痕 */
  .glitch { left: 0; right: 0; height: 14px; background: linear-gradient(90deg, rgba(255,40,90,.0), rgba(255,40,90,.45) 20%, rgba(40,220,255,.45) 60%, rgba(255,255,255,.0)); mix-blend-mode: screen; animation: gl .18s steps(3) forwards; }
  @keyframes gl { 0% { translate: -40px 0; opacity: 1 } 50% { translate: 30px 0 } 100% { translate: 0 0; opacity: 0 } }
  .vign { background: radial-gradient(ellipse at center, transparent 60%, rgba(30,8,30,.32) 100%); transition: opacity 3s; }
  .cracks path { fill: none; stroke: rgba(225,235,255,.4); stroke-width: 1.6; }
  @media (prefers-reduced-motion: reduce) { .rw-clock .hh, .rw-clock .mh, .or-snake { animation-duration: .01s !important; } }
</style>
</head>
<body>
<div id="console" hidden>
  <div class="card">
    <div class="hdr"><span>时牢 · TIME PRISON</span><span class="sync" id="sync"><i></i><span id="synctxt">本地</span></span></div>
    <div class="top">
      <svg class="tally" viewBox="0 0 100 100" id="tally"></svg>
      <div><div class="date" id="cdate">九月三十日</div><div class="big" id="cround">导入</div></div>
    </div>
    <div class="dialwrap">
      <svg class="dial" viewBox="-60 -60 120 120" id="dial"></svg>
      <div class="scn"><b id="cscene">——</b><span id="ckind">尚未开始</span></div>
    </div>
    <div class="gm" id="gm" hidden>
      <h4>场景</h4>
      <div class="r"><button class="b" data-a="prev">◀ 上一场景</button><button class="b" data-a="next">下一场景 ▶</button></div>
      <h4>事件</h4>
      <div class="r"><button class="b" data-a="start">开始第一巡</button><button class="b red" data-a="tragedy">惨剧</button><button class="b vio" data-a="mystery">公开谜团</button><button class="b vio" data-a="rewind">时牢发动 ⟲</button></div>
      <h4>终局</h4>
      <div class="r"><button class="b vio" data-a="climax">进入高潮</button><button class="b red" data-a="orochi">八岐</button><button class="b" data-a="flow">结局·时间流动</button><button class="b red" data-a="eternal">结局·永远的乐园</button></div>
      <div class="r"><button class="b" data-a="reset" style="flex:0 0 auto">重置</button></div>
    </div>
    <div class="note" id="note"></div>
  </div>
</div>
<div id="overlay" hidden><div id="stage"><div class="fill" id="persist"></div><div class="fill" id="fxbox"></div></div></div>

<script>
const STAGE_NS = 'paradise-timeloop'
const CONFIG = {
  role: 'auto',            // auto | console | overlay（auto：宽度 < 800px 为控制台）
  rounds: 4,               // 时限
  sceneKinds: { 1: 'GM 场景', 4: 'GM 场景', 7: '战斗场景' },
  tragedyText: '于是，九月三十日结束了。',
  mysteries: [
    { name: '清陵学园', text: '县里首屈一指的升学学校。平时忙于学习的学生们，只有在文化祭之前的这段时间才会放肆起来。' },
    { name: '文化祭的小道具', text: 'PC们的同好会公开发表的东西。其中隐藏的是……？' }
  ]
}
const NUM = ['零', '一', '二', '三', '四', '五', '六', '七']
const TALLY = ['M18 16 L82 16', 'M50 16 L50 88', 'M50 51 L76 51', 'M26 46 L26 88', 'M12 88 L88 88']

/* <sealstage-runtime v1>
 * SealStage —— 小剧场网页组件的统一运行时（粘贴进每个需要同步的组件）。
 * · 在 SealChat iForm 内：通过 Channel Embed SDK 使用 Storage（持久状态）与 Events（瞬时特效）。
 * · 独立预览时：回落到 BroadcastChannel + localStorage，本机多个标签/iframe 之间同步。
 * · Storage / Events 的作用域是 (频道, iForm)：同一个 iForm 被多次放上舞台时共享状态。
 * API：
 *   Stage.ready            Promise，完成连接或回落后 resolve
 *   Stage.mode             'sealchat' | 'local' | 'unsynced'
 *   Stage.gm               当前用户是否为 World Owner/Admin（本地预览恒为 true，?gm=0 可模拟玩家）
 *   Stage.get(key)         读取已同步的状态
 *   Stage.set(key, value)  写入并广播（乐观更新）
 *   Stage.onState(fn)      fn(key, value)，任何状态变化（含首次拉取）
 *   Stage.emit(topic, p)   广播瞬时事件（本地立即触发一次，远端回声自动去重）
 *   Stage.on(topic, fn)    订阅瞬时事件
 *   Stage.onGM(fn)         GM 身份变化
 */
const Stage = (() => {
  const NS = (typeof STAGE_NS === 'string' && STAGE_NS) || 'sealstage'
  const cfg = window.__SEALCHAT_EMBED_CONFIG__ || {}
  const q = new URLSearchParams(location.search)
  const hostOrigin = q.get('hostOrigin') || cfg.hostOrigin || ''
  const sdkUrl = q.get('sdkUrl') || cfg.sdkUrl || ''
  const framed = window.parent !== window
  const state = {}, stateFns = new Set(), gmFns = new Set(), evtFns = {}, seen = new Set(), topics = new Set()
  let client = null, retry = 1000
  const api = { mode: 'local', gm: q.get('gm') !== '0', ready: null }

  const fireState = (k, v) => { if (v === undefined) delete state[k]; else state[k] = v; stateFns.forEach(fn => { try { fn(k, v) } catch (e) { console.error(e) } }) }
  const fireEvt = (topic, p) => {
    if (p && p._id) { if (seen.has(p._id)) return; seen.add(p._id); if (seen.size > 500) seen.delete(seen.values().next().value) }
    (evtFns[topic] || []).forEach(fn => { try { fn(p || {}) } catch (e) { console.error(e) } })
  }
  const setGM = v => { if (api.gm === v) return; api.gm = v; gmFns.forEach(fn => fn(v)) }

  /* ---------- 本地回落：BroadcastChannel + localStorage（均可能被沙箱禁止，全部 try） ---------- */
  let bc = null
  const lsKey = k => `${NS}:${k}`
  const lsRead = () => { try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(NS + ':')) state[k.slice(NS.length + 1)] = JSON.parse(localStorage.getItem(k)) } } catch {} }
  const lsWrite = (k, v) => { try { v === undefined ? localStorage.removeItem(lsKey(k)) : localStorage.setItem(lsKey(k), JSON.stringify(v)) } catch {} }
  const local = () => {
    try { bc = new BroadcastChannel(NS); bc.onmessage = e => { const m = e.data || {}; if (api.mode === 'sealchat') return; if (m.t === 's') fireState(m.k, m.v); else if (m.t === 'e') fireEvt(m.topic, m.p) } } catch {}
    lsRead(); Object.keys(state).forEach(k => fireState(k, state[k]))
  }
  const bcPost = m => { try { bc && bc.postMessage(m) } catch {} }

  /* ---------- SealChat Embed ---------- */
  const loadSdk = () => window.SealChatEmbed ? Promise.resolve() : new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = sdkUrl; s.async = true
    s.onload = () => window.SealChatEmbed ? res() : rej(new Error('SDK missing')); s.onerror = () => rej(new Error('SDK load failed'))
    document.head.appendChild(s)
  })
  const pullAll = async () => {
    const snap = await client.storage.snapshot()
    const docs = (snap && (snap.documents || snap.items)) || []
    docs.forEach(d => fireState(d.key, d.value))
  }
  const connect = async () => {
    await loadSdk()
    const c = await window.SealChatEmbed.connect({ targetOrigin: hostOrigin || undefined, timeoutMs: 10000 })
    client = c; api.mode = 'sealchat'; retry = 1000
    c.session.onClosed(() => { if (client !== c) return; client = null; setTimeout(() => connect().catch(reconnect), retry) })
    c.storage.onChanged(async ch => {
      if (!ch) return
      if (ch.kind === 'resynced') return pullAll().catch(() => {})
      if (!ch.key) return
      if (ch.kind === 'delete' || ch.op === 'delete') return fireState(ch.key, undefined)
      if ('value' in ch && ch.value !== undefined) return fireState(ch.key, ch.value)
      const doc = await c.storage.get(ch.key).catch(() => null); fireState(ch.key, doc ? doc.value : undefined)
    })
    topics.forEach(t => c.events.on(t, p => fireEvt(t, p)))
    const applyPerm = p => setGM(!!(p && (p.canManageWorld || p.isWorldAdmin || p.isWorldOwner)))
    try { c.permissions.onChanged(applyPerm); applyPerm(await c.permissions.getCurrent()) } catch { setGM(false) }
    await pullAll().catch(() => {})
  }
  const reconnect = err => {
    const code = err && err.code
    if (code && !['HANDSHAKE_FAILED', 'SESSION_EXPIRED', 'CONTEXT_CHANGED', 'TIMEOUT', 'WS_OFFLINE', 'INTERNAL_ERROR'].includes(code)) { console.warn('[SealStage]', code, err.message); return }
    setTimeout(() => connect().catch(reconnect), retry); retry = Math.min(retry * 2, 30000)
  }

  api.ready = (async () => {
    if (framed && hostOrigin && sdkUrl) {
      api.gm = false
      try { await connect() } catch (e) { reconnect(e) }
    } else {
      // 本地预览页与组件同源，可访问 parent；SealChat 里未启用 Embed API 或裸外链时访问会抛错
      let parentSame = false
      try { parentSame = !!window.parent.location.href } catch {}
      if (framed && !parentSame) { api.mode = 'unsynced'; api.gm = false }
      local()
    }
  })()

  api.get = k => state[k]
  api.set = async (k, v) => {
    fireState(k, v)
    if (client) { try { await client.storage.set(k, v) } catch (e) { console.warn('[SealStage] storage.set', e && e.code, e && e.message) } }
    else { lsWrite(k, v); bcPost({ t: 's', k, v }) }
  }
  // 新订阅者立即收到当前全部状态（本地模式的初始状态在组件注册前就已读出）
  api.onState = fn => { stateFns.add(fn); Object.keys(state).forEach(k => fn(k, state[k])); return () => stateFns.delete(fn) }
  api.onGM = fn => { gmFns.add(fn); return () => gmFns.delete(fn) }
  api.on = (topic, fn) => {
    (evtFns[topic] = evtFns[topic] || []).push(fn)
    if (!topics.has(topic)) { topics.add(topic); if (client) client.events.on(topic, p => fireEvt(topic, p)) }
  }
  api.emit = async (topic, payload) => {
    const p = Object.assign({}, payload, { _id: Math.random().toString(36).slice(2) + Date.now().toString(36), _at: Date.now() })
    fireEvt(topic, p)
    if (client) { try { await client.events.publish(topic, p) } catch (e) { console.warn('[SealStage] events.publish', e && e.code) } }
    else bcPost({ t: 'e', topic, p })
  }
  return api
})()
/* </sealstage-runtime> */

const $ = id => document.getElementById(id)
const qs = new URLSearchParams(location.search)
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
const DEFAULT = { phase: 'intro', round: 0, scene: 0, mystery: false, ending: null }
let S = Object.assign({}, DEFAULT)
let role = null

/* ---------- 角色：按尺寸自动切换 ---------- */
function pickRole () {
  const want = qs.get('role') || CONFIG.role
  const r = want === 'auto' ? (innerWidth < 800 ? 'console' : 'overlay') : want
  if (r === role) return
  role = r
  $('console').hidden = r !== 'console'; $('overlay').hidden = r !== 'overlay'
  render()
}
function fit () { const s = Math.max(innerWidth / 1920, innerHeight / 1080); $('stage').style.transform = `translate(-50%,-50%) scale(${s})` }
addEventListener('resize', () => { pickRole(); fit() })

/* ---------- 控制台 ---------- */
function tallySVG (n, cls = '') { return TALLY.map((d, i) => `<path d="${d}" class="${i < n ? (i === 4 ? 'doom' : 'on') : ''} ${i === n - 1 ? cls : ''}"/>`).join('') }
function buildDial () {
  let h = '<circle r="54" fill="#fffaf1" stroke="#2a2238" stroke-width="2"/><circle r="47" fill="none" stroke="rgba(42,34,56,.2)" stroke-dasharray="1 3"/>'
  for (let i = 1; i <= 7; i++) {
    const a = (-90 + (i - 1) * 360 / 7) * Math.PI / 180, x = Math.cos(a) * 40, y = Math.sin(a) * 40
    const kind = CONFIG.sceneKinds[i]
    h += kind === '战斗场景' ? `<rect x="${x - 5}" y="${y - 5}" width="10" height="10" transform="rotate(45 ${x} ${y})" fill="#e0453a" id="m${i}"/>`
      : `<circle cx="${x}" cy="${y}" r="${kind ? 4.6 : 5.6}" fill="${kind ? '#fffaf1' : '#2a2238'}" stroke="#2a2238" stroke-width="1.6" id="m${i}"/>`
    h += `<text x="${Math.cos(a) * 26}" y="${Math.sin(a) * 26 + 3}" font-size="8" text-anchor="middle" fill="rgba(42,34,56,.6)">${i}</text>`
  }
  h += '<g class="hand" id="dhand"><line y2="-34" stroke="#e0453a" stroke-width="3" stroke-linecap="round"/></g><circle r="4" fill="#e0453a"/>'
  $('dial').innerHTML = h
}
function renderConsole () {
  const { phase, round, scene } = S
  $('tally').innerHTML = tallySVG(phase === 'ending' && S.ending === 'eternal' ? 5 : round)
  $('cround').textContent = phase === 'intro' ? '导入' : phase === 'climax' ? '高潮' : phase === 'ending' ? (S.ending === 'flow' ? '十月一日' : '永远') : `第${NUM[round]}巡`
  $('cdate').textContent = phase === 'ending' && S.ending === 'flow' ? '时间再次流动' : phase === 'climax' ? '时牢 · 破绽' : '九月三十日'
  $('cscene').textContent = phase === 'loop' && scene ? `场景 ${scene} / 7` : phase === 'intro' ? '社团教室' : '——'
  $('ckind').textContent = phase === 'loop' ? (scene ? (CONFIG.sceneKinds[scene] || '剧情场景') : '巡开始') : phase === 'intro' ? '导入阶段' : phase === 'climax' ? '高潮阶段' : '结局'
  $('dhand').style.rotate = `${((scene || 1) - 1) * 360 / 7}deg`
  for (let i = 1; i <= 7; i++) { const m = $('m' + i); if (m) m.style.opacity = phase === 'loop' && scene && i > scene ? .35 : 1 }
  $('gm').hidden = !Stage.gm
  const btn = a => document.querySelector(`[data-a="${a}"]`)
  btn('prev').disabled = phase !== 'loop' || scene <= 1
  btn('next').disabled = phase !== 'loop' || scene >= 7
  btn('start').hidden = phase !== 'intro'
  btn('rewind').disabled = phase !== 'loop' || round >= CONFIG.rounds
  btn('tragedy').hidden = phase === 'intro'
  btn('mystery').disabled = S.mystery || phase === 'intro'
  btn('climax').disabled = phase === 'climax' || phase === 'ending' || phase === 'intro'
  btn('orochi').disabled = phase !== 'climax'
  $('note').textContent = phase === 'loop' && round >= CONFIG.rounds ? '最后一巡：第四巡结束前若传达"暗号"则进入高潮，否则——永远的乐园。' : (Stage.gm ? '' : '仅 GM 可以操作时牢。')
  const sync = $('sync'), m = Stage.mode
  sync.classList.toggle('off', m !== 'sealchat'); $('synctxt').textContent = m === 'sealchat' ? '已同步' : m === 'unsynced' ? '未启用 Embed API' : '本地预览'
}

/* GM 操作 = 写状态 + 发特效事件 */
let armed = null, armTimer = 0
function act (a) {
  const n = Object.assign({}, S)
  const fx = p => Stage.emit('tl.fx', p)
  switch (a) {
    case 'start': Object.assign(n, { phase: 'loop', round: 1, scene: 0 }); Stage.set('loop', n); fx({ fx: 'round', round: 1 }); break
    case 'next': n.scene = Math.min(7, n.scene + 1); Stage.set('loop', n); fx({ fx: 'scene', round: n.round, scene: n.scene }); break
    case 'prev': n.scene = Math.max(1, n.scene - 1); Stage.set('loop', n); break
    case 'tragedy': fx({ fx: 'tragedy', round: n.round }); break
    case 'mystery': n.mystery = true; Stage.set('loop', n); fx({ fx: 'mystery' }); break
    case 'rewind': n.round = Math.min(CONFIG.rounds, n.round + 1); n.scene = 0; Stage.set('loop', n); fx({ fx: 'rewind', round: n.round }); break
    case 'climax': Object.assign(n, { phase: 'climax' }); Stage.set('loop', n); fx({ fx: 'climax' }); break
    case 'orochi': fx({ fx: 'orochi' }); break
    case 'flow': case 'eternal': Object.assign(n, { phase: 'ending', ending: a }); Stage.set('loop', n); fx({ fx: 'ending', kind: a }); break
    case 'reset': Stage.set('loop', Object.assign({}, DEFAULT)); break
  }
}
$('gm').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return
  const a = b.dataset.a
  if (['reset', 'eternal', 'flow'].includes(a) && armed !== b) {   // 二次确认（sandbox 内不能用 confirm）
    if (armed) { armed.classList.remove('arm'); armed.textContent = armed.dataset.label }
    armed = b; b.dataset.label = b.textContent; b.classList.add('arm'); b.textContent = '再点一次确认'
    clearTimeout(armTimer); armTimer = setTimeout(() => { b.classList.remove('arm'); b.textContent = b.dataset.label; armed = null }, 3000)
    return
  }
  if (armed) { armed.classList.remove('arm'); armed.textContent = armed.dataset.label; armed = null }
  act(a)
})

/* ================= 特效层 ================= */
const box = () => $('fxbox')
function mount (cls, html, ms) {
  const d = document.createElement('div'); d.className = 'fx ' + cls; d.innerHTML = html
  box().appendChild(d); if (ms) setTimeout(() => d.remove(), reduced ? Math.min(ms, 2500) : ms)
  return d
}
const R = (a, b) => a + Math.random() * (b - a)
function petals (n, dir, area = [0, 1920]) {
  return Array.from({ length: n }, () => `<i class="petal ${dir}" style="left:${R(area[0], area[1])}px;top:${dir === 'up' ? R(900, 1180) : R(-120, 200)}px;--dx:${R(-200, 200)}px;animation-duration:${R(2.4, 4.4)}s;animation-delay:${R(0, 2.2)}s"></i>`).join('')
}

const clearRibbons = () => box().querySelectorAll('.ribbon').forEach(r => r.parentNode.remove())
function fxScene ({ round, scene }) {
  clearRibbons()
  const kind = CONFIG.sceneKinds[scene] || '剧情场景'
  mount('', `<div class="abs ribbon${S.phase === 'climax' ? ' night' : ''}"><div class="tail l"></div><div class="body"><div class="main">第${NUM[round]}巡　<em>·</em>　场景 ${scene}</div><div class="sub">九月三十日　${kind}</div></div><div class="tail r"></div></div>`, 4200)
}
function fxRound ({ round }) {
  clearRibbons()
  mount('', `<div class="abs ribbon"><div class="tail l"></div><div class="body"><div class="main">第${NUM[round]}巡　<em>·</em>　九月三十日</div><div class="sub">清陵学园　文化祭前日</div></div><div class="tail r"></div></div>`, 4200)
}

function fxRewind ({ round }) {
  let roman = '', ticks = ''
  const RN = ['XII', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI']
  for (let i = 0; i < 12; i++) { const a = (i * 30 - 90) * Math.PI / 180; roman += `<text x="${Math.cos(a) * 370}" y="${Math.sin(a) * 370 + 22}" text-anchor="middle" font-size="64" fill="rgba(238,242,251,.85)" font-family="Noto Serif SC, serif">${RN[i]}</text>` }
  for (let i = 0; i < 60; i++) { const a = i * 6 * Math.PI / 180, r1 = i % 5 ? 430 : 412; ticks += `<line x1="${Math.cos(a) * r1}" y1="${Math.sin(a) * r1}" x2="${Math.cos(a) * 446}" y2="${Math.sin(a) * 446}" stroke="rgba(238,242,251,.7)" stroke-width="${i % 5 ? 2 : 5}"/>` }
  const rings = Array.from({ length: 6 }, (_, i) => `<div class="center rw-ring" style="animation-delay:${.8 + i * .32}s"></div>`).join('')
  const doom = round >= 5
  const d = mount('', `
    <div class="fill rw-veil"></div>${rings}
    <svg class="center rw-clock" viewBox="-460 -460 920 920"><circle r="452" fill="none" stroke="rgba(238,242,251,.5)" stroke-width="3"/><circle r="300" fill="none" stroke="rgba(238,242,251,.15)" stroke-width="80"/>${ticks}${roman}
      <g class="hh"><line y2="-220" stroke="#fbf1e2" stroke-width="16" stroke-linecap="round"/></g><g class="mh"><line y2="-340" stroke="#e0453a" stroke-width="8" stroke-linecap="round"/></g><circle r="18" fill="#e0453a"/></svg>
    <div class="center rw-time" id="rwt">23:59:59</div>
    ${petals(40, 'up')}
    <div class="fill rw-flash"></div>
    <div class="center rw-date">九月三十日　午前零时</div>
    <div class="center rw-round"><svg viewBox="0 0 100 100">${TALLY.map((p, i) => `<path d="${p}" pathLength="100" class="${i < round - 1 ? 'on' : i === round - 1 ? 'new' + (doom ? ' doom' : '') : ''}"/>`).join('')}</svg><span class="t">第${NUM[round]}巡</span></div>`, 7800)
  // 倒数的时间：23:59:59 → 00:00:00
  const t = d.querySelector('#rwt'); let s = 86399
  const start = performance.now()
  const step = now => {
    const k = Math.min(1, (now - start - 1000) / 2400); if (k > 0) s = Math.round(86399 * (1 - k * k))
    const hh = String(Math.floor(s / 3600)).padStart(2, '0'), mm = String(Math.floor(s % 3600 / 60)).padStart(2, '0'), ss = String(s % 60).padStart(2, '0')
    t.textContent = `${hh}:${mm}:${ss}`
    if (k < 1 && d.isConnected) requestAnimationFrame(step)
  }
  requestAnimationFrame(step)
}

function lilySVG () {
  let g = ''
  for (let i = 0; i < 6; i++) {
    const a = i * 60 + R(-10, 10)
    g += `<g transform="rotate(${a})"><path class="pt" style="animation-delay:${1.7 + i * .06}s" d="M0 0 C 30 -10, 70 -6, 92 10 C 104 20, 98 34, 86 28 C 80 18, 70 14, 52 12 C 30 10, 12 8, 0 0 Z" fill="#c8243a"/></g>`
    for (let k = 0; k < 2; k++) {
      const b = a + k * 30 + R(-8, 8), rad = b * Math.PI / 180, L = R(150, 200)
      const x2 = Math.cos(rad) * L, y2 = Math.sin(rad) * L - 60, cx = Math.cos(rad) * L * .5, cy = Math.sin(rad) * L * .5 - 110
      g += `<path class="st" pathLength="1" style="animation-delay:${1.9 + R(0, .4)}s" d="M0 0 Q ${cx} ${cy} ${x2} ${y2}" stroke="#e23b4e" stroke-width="2.4" fill="none"/><circle cx="${x2}" cy="${y2}" r="4" fill="#ffd27a" class="pt" style="transform-origin:${x2}px ${y2}px;animation-delay:2.7s"/>`
    }
  }
  return `<svg class="abs tg-lily" viewBox="-260 -260 520 520"><path d="M0 20 C -6 120, 6 200, -4 260" stroke="#2c3a24" stroke-width="7" fill="none"/>${g}<circle r="10" fill="#8d1426"/></svg>`
}
function fxTragedy () {
  const text = [...CONFIG.tragedyText].map((c, i) => `<span style="animation-delay:${2 + i * .12}s">${c}</span>`).join('')
  mount('', `
    <div class="fill tg-dark"></div><div class="fill tg-pulse"></div>
    <svg class="abs tg-half"><path class="L" d="M -20 540 C 300 548, 640 532, 958 540"/><path class="R" d="M 962 540 C 1280 548, 1620 532, 1940 540"/></svg>
    <div class="abs tg-spark"></div>
    ${lilySVG()}
    <div class="tg-out">${petals(46, 'down')}<div class="abs tg-small">第七场景</div><div class="abs tg-text">${text}</div></div>`, 7000)
}

function fxMystery () {
  const cards = CONFIG.mysteries.map((m, i) => `
    <div class="center my-card my-out" style="left:${960 + (i - (CONFIG.mysteries.length - 1) / 2) * 480}px;top:640px">
      <div class="in" style="animation-delay:${.6 + i * .35}s"><div class="f"><span class="k">谜团</span><h3>${m.name}</h3><p>${m.text}</p><span class="q">谜</span></div><div class="bk">？</div></div>
    </div>`).join('')
  mount('', `<div class="fill my-veil"></div><div class="center my-head">谜团公开</div>${cards}<div class="center my-foot">详情请查看「资料夹 · 谜团」</div>`, 8200)
}

/* 从中心放射的裂纹 + 碎片 */
function cracks (cx, cy, n, len) {
  let p = ''
  for (let i = 0; i < n; i++) {
    let a = i / n * Math.PI * 2 + R(-.2, .2), x = cx, y = cy, d = `M${cx} ${cy}`
    const L = R(len * .5, len)
    for (let s = 0; s < L; s += R(40, 90)) { a += R(-.35, .35); x += Math.cos(a) * 70; y += Math.sin(a) * 70; d += ` L${x.toFixed(0)} ${y.toFixed(0)}` }
    p += `<path pathLength="1" d="${d}" style="animation-delay:${R(0, .5).toFixed(2)}s"/>`
  }
  return p
}
function fxClimax () {
  const cx = 960, cy = 420, N = 22
  const pts = Array.from({ length: N }, (_, i) => { const a = i / N * Math.PI * 2 + R(-.08, .08); return [cx + Math.cos(a) * 2400, cy + Math.sin(a) * 2400] })
  const shards = pts.map((p, i) => { const q = pts[(i + 1) % N], m = R(.25, .6); return `<polygon class="cl-shard" points="${cx},${cy} ${cx + (p[0] - cx) * m},${cy + (p[1] - cy) * m} ${cx + (q[0] - cx) * m},${cy + (q[1] - cy) * m}" style="--dx:${R(-300, 300)}px;--r:${R(-120, 120)}deg;animation-delay:${1.6 + R(0, .5)}s"/>` }).join('')
  mount('', `
    <svg class="fill cl-crack" viewBox="0 0 1920 1080">${cracks(cx, cy, 14, 1300)}</svg>
    <svg class="fill" viewBox="0 0 1920 1080">${shards}</svg>
    <div class="fill cl-moon"></div>
    <div class="center cl-t1">「时牢」出现了破绽</div>
    <div class="center cl-t2">乐园<em>·</em>终焉</div>`, 8600)
  setTimeout(renderPersist, 2400)
}

function fxOrochi () {
  const snakes = Array.from({ length: 8 }, (_, i) => {
    const x = 120 + i * 240 + R(-40, 40), h = R(520, 760), flip = i % 2 ? -1 : 1
    const path = `M 60 ${h} C ${60 + 80 * flip} ${h * .75}, ${60 - 90 * flip} ${h * .5}, ${60 + 40 * flip} ${h * .25} S ${60 - 30 * flip} 40, 60 30`
    return `<svg class="or-snake" width="120" height="${h + 40}" style="left:${x - 60}px;animation-delay:${i * .12}s,${1.4 + i * .1}s,4.6s">
      <path d="${path}" stroke="#14070f" stroke-width="58" stroke-linecap="round" fill="none"/><path d="${path}" stroke="#2a0f1e" stroke-width="40" stroke-linecap="round" fill="none"/>
      <ellipse cx="60" cy="30" rx="34" ry="24" fill="#14070f"/><circle cx="${60 + 12 * flip}" cy="24" r="5" fill="#ff2a3a"/></svg>`
  }).join('')
  mount('', `<div class="fill or-veil"></div>${snakes}<div class="center or-t">八岐</div>`, 6000)
}

function calPage (n, head, sub, eve) { return `<div class="hd">${head} <small>${sub}</small></div><div class="n">${n}</div><div class="e">${eve}</div>` }
function fxEnding ({ kind }, still) {
  box().innerHTML = ''
  const flow = kind === 'flow'
  const d = document.createElement('div'); d.className = 'fx'; box().appendChild(d)
  if (flow) {
    d.innerHTML = `<div class="fill en-bg flow"${still ? ' style="animation:none;opacity:1"' : ''}></div>
      <div class="abs cal"><div class="pg">${calPage(1, '十月', 'OCTOBER', '清陵祭 当日')}</div>${still ? '' : `<div class="pg" id="p30">${calPage(30, '九月', 'SEPTEMBER', '清陵祭 前日')}</div>`}</div>
      <div class="center en-t1" style="color:#2a2238;animation-delay:${still ? 0 : 2.6}s">时间　再次开始流动</div>
      <div class="center en-t2" style="color:#e0453a;animation-delay:${still ? 0 : 3.6}s">清陵祭，开幕</div>
      <div class="abs en-end" style="color:#2a2238;animation-delay:${still ? 0 : 5}s">乐园 · 终</div>`
    if (!still) {
      setTimeout(() => d.querySelector('#p30')?.classList.add('tear'), 1200)
      const conf = Array.from({ length: 70 }, () => `<i class="confetti" style="left:${R(0, 1920)}px;background:${['#e0453a', '#f4c56a', '#8a6bb8', '#7fbfa8', '#ee8a6c', '#fbf1e2'][Math.random() * 6 | 0]};--dx:${R(-200, 200)}px;--r:${R(-900, 900)}deg;animation-duration:${R(3, 6)}s;animation-delay:${R(2.2, 4.5)}s;clip-path:polygon(0 0,100% 10%,90% 100%,6% 90%)"></i>`).join('')
      d.insertAdjacentHTML('beforeend', conf)
    }
  } else {
    d.innerHTML = `<div class="fill en-bg eternal"${still ? ' style="animation:none;opacity:1"' : ''}></div>
      <div class="abs cal" id="ecal"><div class="pg">${calPage(30, '九月', 'SEPTEMBER', '清陵祭 前日')}</div></div>
      <svg class="abs en-tally" viewBox="0 0 100 100" style="animation-delay:${still ? 0 : 5}s">${TALLY.map((p, i) => `<path d="${p}" pathLength="100" class="${i === 4 ? 'doom' : ''}" style="animation-delay:${still ? 0 : 5.6}s"/>`).join('')}</svg>
      <div class="center en-t1" style="color:#f3e4cc;animation-delay:${still ? 0 : 4.6}s">欢迎回来。</div>
      <div class="center en-t2" style="color:#e9b8a8;animation-delay:${still ? 0 : 5.6}s">这里是——永远的九月三十日</div>`
    if (!still) {
      const cal = d.querySelector('#ecal')
      ;[1000, 2200, 3100, 3700].forEach((t, i) => setTimeout(() => {
        const top = cal.lastElementChild, under = document.createElement('div')
        under.className = 'pg'; under.innerHTML = calPage(30, '九月', 'SEPTEMBER', '清陵祭 前日'); cal.insertBefore(under, top)
        top.style.animationDuration = (1.3 - i * .25) + 's'; top.classList.add('tear'); setTimeout(() => top.remove(), 1400)
      }, t))
      setTimeout(() => cal.classList.add('sepia'), 2600)
    } else d.querySelector('#ecal').classList.add('sepia')
  }
}

/* 常驻层：随巡数增加的不安感 / 高潮裂痕 */
let glitchTimer = 0
function renderPersist () {
  const p = $('persist'); if (!p) return
  const climax = S.phase === 'climax', late = S.phase === 'loop' && S.round >= 3
  p.innerHTML = (late || climax ? `<div class="fill vign" style="opacity:${climax ? .9 : S.round >= 4 ? .8 : .45}"></div>` : '') +
    (climax ? `<svg class="fill cracks" viewBox="0 0 1920 1080">${[[0, 0], [1920, 0], [0, 1080], [1920, 1080]].map(([x, y]) => cracks(x, y, 5, 300)).join('')}</svg>` : '')
  if (climax) p.querySelectorAll('.cracks path').forEach(e => { e.style.strokeDasharray = 'none' })
  clearTimeout(glitchTimer)
  if (late && !reduced) {
    const loop = () => {
      glitchTimer = setTimeout(() => {
        const n = S.round >= 4 ? 3 : 1
        for (let i = 0; i < n; i++) { const g = document.createElement('div'); g.className = 'abs glitch'; g.style.top = R(80, 1000) + 'px'; p.appendChild(g); setTimeout(() => g.remove(), 300) }
        loop()
      }, R(22000, 48000) / (S.round >= 4 ? 1.6 : 1))
    }
    loop()
  }
  if (S.phase === 'ending' && S.ending && !box().children.length) fxEnding({ kind: S.ending }, true)
  if (S.phase !== 'ending' && box().querySelector('.en-bg')) box().innerHTML = ''
}

const FX = { scene: fxScene, round: fxRound, rewind: fxRewind, tragedy: fxTragedy, mystery: fxMystery, climax: fxClimax, orochi: fxOrochi, ending: p => fxEnding(p) }
Stage.on('tl.fx', p => { if (role === 'overlay' && FX[p.fx]) FX[p.fx](p) })

/* ---------- 状态 ---------- */
function render () { if (role === 'console') renderConsole(); else if (role === 'overlay') renderPersist() }
Stage.onState((k, v) => { if (k !== 'loop') return; S = Object.assign({}, DEFAULT, v || {}); render() })
Stage.onGM(render)
buildDial(); pickRole(); fit()
Stage.ready.then(render)
</script>
