<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><!-- 跟随宿主 iframe 的配色方案，避免浏览器在 iframe 后垫不透明底色 -->
<title>氛围粒子层</title>
<!--
  SealStage · 氛围粒子层（持续动效）
  用法：铺满舞台、置顶、关闭交互。背景透明，不拦截任何东西。
  修改下方 CONFIG 即可换预设；本地预览可用 ?preset=snow&density=1.5&reverse=1 覆盖。
-->
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const CONFIG = {
  preset: 'sakura',   // 可用 + 组合，如 'dragonflies+dust'。sakura | plum | snow | fireflies | stars | embers | leaves | ginkgo | dust | dragonflies | crows | rain | bubbles | moondust
  density: 1,         // 数量倍率（0.2–3）
  speed: 1,           // 速度倍率
  wind: 0.25,         // 横向风（负数向左）
  reverse: false,     // 时间倒流：所有粒子反向运动
  colors: null,       // 覆盖预设颜色，例如 ['#fff', '#fcd']
  avoidCenter: 0      // 0–1：主窗中心区域的粒子透明度衰减（保护主窗）
}

/* 本地预览参数覆盖 */
const qs = new URLSearchParams(location.search)
for (const k of Object.keys(CONFIG)) if (qs.has(k)) {
  const v = qs.get(k); CONFIG[k] = k === 'preset' ? v : k === 'reverse' ? v === '1' || v === 'true' : k === 'colors' ? v.split(',') : Number(v)
}

const PRESETS = {
  sakura:      { n: 46, colors: ['#ffd9e2', '#ffc2d1', '#fbe7ee', '#f7b6c8'], draw: 'petal', size: [6, 13], vy: [18, 42], spin: 1.6, sway: 30 },
  plum:        { n: 40, colors: ['#e2483f', '#c7302b', '#f06d5e', '#fff1e6'], draw: 'petal', size: [5, 10], vy: [16, 36], spin: 1.6, sway: 26 },
  snow:        { n: 120, colors: ['#ffffff', '#eef4ff'], draw: 'dot', size: [1, 3.6], vy: [14, 46], spin: 0, sway: 18, blur: true },
  fireflies:   { n: 34, colors: ['#e6ff9a', '#fff4b0', '#b6ffcf'], draw: 'glow', size: [1.5, 3], vy: [-6, 6], spin: 0, sway: 36, wander: true, blink: true },
  stars:       { n: 150, colors: ['#ffffff', '#cfe0ff', '#fff3d6'], draw: 'twinkle', size: [0.5, 1.8], vy: [0, 0], spin: 0, sway: 0, still: true, shooting: true },
  embers:      { n: 60, colors: ['#ffb347', '#ff7a2e', '#ffd28a', '#ff4d2e'], draw: 'glow', size: [1, 2.8], vy: [-60, -24], spin: 0, sway: 22, blink: true },
  leaves:      { n: 26, colors: ['#d9542b', '#e8833a', '#b8371f', '#f0a640'], draw: 'maple', size: [9, 16], vy: [22, 46], spin: 1.2, sway: 40 },
  ginkgo:      { n: 26, colors: ['#f2c94c', '#e9b23a', '#f7dc7a'], draw: 'ginkgo', size: [8, 14], vy: [20, 44], spin: 1.3, sway: 38 },
  dust:        { n: 70, colors: ['#ffe2a6', '#fff2cf', '#ffd27a'], draw: 'glow', size: [0.8, 2.2], vy: [-4, 6], spin: 0, sway: 14, wander: true, blink: true },
  dragonflies: { n: 5, colors: ['#d7352b', '#e4553a', '#c22a22'], draw: 'dragonfly', size: [16, 24], vy: [0, 0], spin: 0, sway: 0, glide: true },
  crows:       { n: 5, colors: ['#141414', '#222'], draw: 'crow', size: [14, 26], vy: [-6, 6], spin: 0, sway: 0, glide: true },
  rain:        { n: 160, colors: ['rgba(200,220,255,.55)', 'rgba(160,190,240,.4)'], draw: 'streak', size: [10, 22], vy: [520, 820], spin: 0, sway: 0 },
  bubbles:     { n: 30, colors: ['rgba(200,240,255,.7)', 'rgba(255,255,255,.6)'], draw: 'ring', size: [3, 10], vy: [-40, -16], spin: 0, sway: 20 },
  moondust:    { n: 90, colors: ['#e9f0ff', '#c9d6f5', '#fff8e8'], draw: 'glow', size: [0.6, 2], vy: [-10, -2], spin: 0, sway: 10, wander: true, blink: true }
}

const cv = document.getElementById('c'), ctx = cv.getContext('2d')
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
let W = 0, H = 0, DPR = 1, parts = []
const SYS = String(CONFIG.preset).split('+').map(k => PRESETS[k.trim()]).filter(Boolean)
if (!SYS.length) SYS.push(PRESETS.sakura)
const SHOOT = SYS.some(x => x.shooting)
const rnd = (a, b) => a + Math.random() * (b - a)
const pick = a => a[(Math.random() * a.length) | 0]

function resize () {
  DPR = Math.min(2, window.devicePixelRatio || 1)
  W = innerWidth; H = innerHeight
  cv.width = W * DPR; cv.height = H * DPR
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0)
  init()
}
function spawn (p, fresh) {
  const P = p.P, colors = CONFIG.colors || P.colors
  p.z = rnd(0.45, 1)                              // 深度：越小越远、越慢、越淡
  p.s = rnd(P.size[0], P.size[1]) * p.z
  p.c = pick(colors)
  p.vy = rnd(P.vy[0], P.vy[1]) * p.z
  p.vx = CONFIG.wind * 60 * p.z + (P.glide ? rnd(40, 90) * (Math.random() < .5 ? -1 : 1) : 0)
  p.rot = rnd(0, Math.PI * 2); p.vr = rnd(-1, 1) * P.spin
  p.ph = rnd(0, Math.PI * 2); p.flip = rnd(0, Math.PI * 2)
  p.a = rnd(0.55, 1)
  if (P.still || fresh) { p.x = rnd(0, W); p.y = rnd(0, H) }
  else if (P.glide) { p.x = p.vx > 0 ? -40 : W + 40; p.y = rnd(H * .08, H * .7) }
  else { p.x = rnd(-W * .1, W * 1.1); p.y = p.vy >= 0 ? -20 : H + 20 }
  p.life = 0; p.hover = 0
  return p
}
function init () {
  const k = CONFIG.density * (reduced ? .4 : 1) * Math.min(1.6, (W * H) / (1920 * 1080) + .35)
  parts = SYS.flatMap(P => Array.from({ length: Math.round(P.n * k) }, () => spawn({ P }, true)))
  shooting = null
}

/* ---------- 形状 ---------- */
function petal (s) {
  ctx.beginPath(); ctx.moveTo(0, -s)
  ctx.bezierCurveTo(s * .9, -s * .7, s * .8, s * .55, 0, s)
  ctx.bezierCurveTo(-s * .8, s * .55, -s * .9, -s * .7, 0, -s)
  ctx.lineTo(-s * .18, -s * .82); ctx.lineTo(0, -s * .62); ctx.lineTo(s * .18, -s * .82); ctx.closePath(); ctx.fill()
}
function maple (s) {
  ctx.beginPath()
  for (let i = 0; i < 10; i++) { const r = i % 2 ? s * .42 : s; const a = -Math.PI / 2 + i * Math.PI / 5; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r) }
  ctx.closePath(); ctx.fill(); ctx.fillRect(-s * .05, 0, s * .1, s * 1.1)
}
function ginkgo (s) {
  ctx.beginPath(); ctx.moveTo(0, s * .9)
  ctx.lineTo(-s * .12, 0); ctx.quadraticCurveTo(-s, -s * .2, -s * .85, -s * .8)
  ctx.quadraticCurveTo(-s * .2, -s * 1.05, -s * .05, -s * .6); ctx.lineTo(0, -s * .45); ctx.lineTo(s * .05, -s * .6)
  ctx.quadraticCurveTo(s * .2, -s * 1.05, s * .85, -s * .8); ctx.quadraticCurveTo(s, -s * .2, s * .12, 0)
  ctx.closePath(); ctx.fill()
}
function dragonfly (p, t) {
  const s = p.s, f = Math.sin(t * 60 + p.ph) * .35
  ctx.save(); ctx.rotate(Math.atan2(p.dy || 0, p.vx) + (p.vx < 0 ? Math.PI : 0)); if (p.vx < 0) ctx.scale(-1, 1)
  ctx.globalAlpha *= .55; ctx.fillStyle = 'rgba(255,255,255,.75)'
  for (const [ox, sy] of [[s * .12, -1], [s * .12, 1], [-s * .12, -1], [-s * .12, 1]]) {
    ctx.save(); ctx.translate(ox, 0); ctx.rotate(sy * (0.35 + f)); ctx.beginPath(); ctx.ellipse(0, sy * s * .42, s * .13, s * .45, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore()
  }
  ctx.globalAlpha /= .55; ctx.strokeStyle = p.c; ctx.lineCap = 'round'; ctx.lineWidth = Math.max(1.2, s * .1)
  ctx.beginPath(); ctx.moveTo(s * .38, 0); ctx.lineTo(-s * .9, 0); ctx.stroke()
  ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(s * .42, 0, s * .1, 0, Math.PI * 2); ctx.fill()
  ctx.restore()
}
function crow (p, t) {
  const s = p.s, f = Math.sin(t * 9 + p.ph)
  ctx.save(); if (p.vx < 0) ctx.scale(-1, 1)
  ctx.beginPath(); ctx.moveTo(-s, -f * s * .6); ctx.quadraticCurveTo(-s * .4, -s * .1 - f * s * .3, 0, 0)
  ctx.quadraticCurveTo(s * .4, -s * .1 - f * s * .3, s, -f * s * .6); ctx.quadraticCurveTo(s * .4, s * .12, 0, s * .16)
  ctx.quadraticCurveTo(-s * .4, s * .12, -s, -f * s * .6); ctx.fill(); ctx.restore()
}

/* ---------- 主循环 ---------- */
let last = performance.now(), shooting = null
function frame (now) {
  const dt = Math.min(.05, (now - last) / 1000) * CONFIG.speed * (reduced ? .5 : 1) * (CONFIG.reverse ? -1 : 1)
  last = now
  const t = now / 1000
  ctx.clearRect(0, 0, W, H)
  for (const p of parts) {
    const P = p.P
    p.life += Math.abs(dt)
    if (P.wander) { p.vx += Math.sin(t * .7 + p.ph) * 4 * Math.abs(dt); p.vy += Math.cos(t * .5 + p.ph) * 4 * Math.abs(dt) }
    if (P.glide) {
      if (p.hover > 0) p.hover -= Math.abs(dt)
      else if (Math.random() < .004) p.hover = rnd(.6, 1.8)
      const k = p.hover > 0 ? .08 : 1
      p.dy = Math.sin(t * 1.3 + p.ph) * 18
      p.x += p.vx * dt * k; p.y += p.dy * dt * k
    } else if (!P.still) {
      p.x += (p.vx + Math.sin(t * 1.1 + p.ph) * P.sway * p.z) * dt
      p.y += p.vy * dt
    }
    p.rot += p.vr * dt; p.flip += dt * 2.2
    // 出界回收（反向时从另一侧回收）
    const out = p.x < -60 || p.x > W + 60 || p.y < -60 || p.y > H + 60
    if (out && !P.still) {
      spawn(p)
      if (CONFIG.reverse && !P.glide) p.y = p.vy >= 0 ? H + 20 : -20
      if (CONFIG.reverse && P.glide) p.x = p.vx > 0 ? W + 40 : -40
    }
    let a = p.a * (0.35 + p.z * .65)
    if (P.blink) a *= .45 + .55 * Math.abs(Math.sin(t * (1 + p.z) + p.ph))
    if (P.draw === 'twinkle') a *= .3 + .7 * Math.abs(Math.sin(t * (.6 + p.z) + p.ph))
    if (CONFIG.avoidCenter) {
      const dx = (p.x - W / 2) / (W * .3), dy = (p.y - H * .42) / (H * .3)
      a *= 1 - CONFIG.avoidCenter * Math.max(0, 1 - Math.hypot(dx, dy))
    }
    ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, a)); ctx.translate(p.x, p.y)
    ctx.fillStyle = p.c; ctx.strokeStyle = p.c
    switch (P.draw) {
      case 'petal': ctx.rotate(p.rot); ctx.scale(Math.cos(p.flip) * .8 + .2 * Math.sign(Math.cos(p.flip) || 1), 1); petal(p.s); break
      case 'maple': ctx.rotate(p.rot); ctx.scale(Math.cos(p.flip) * .7 + .3, 1); maple(p.s); break
      case 'ginkgo': ctx.rotate(p.rot); ctx.scale(Math.cos(p.flip) * .7 + .3, 1); ginkgo(p.s); break
      case 'dot': if (P.blur && p.z < .7) { ctx.shadowColor = p.c; ctx.shadowBlur = 4 } ctx.beginPath(); ctx.arc(0, 0, p.s, 0, Math.PI * 2); ctx.fill(); break
      case 'glow': { const g = ctx.createRadialGradient(0, 0, 0, 0, 0, p.s * 4); g.addColorStop(0, p.c); g.addColorStop(.25, p.c); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, p.s * 4, 0, Math.PI * 2); ctx.fill(); break }
      case 'twinkle': ctx.beginPath(); ctx.arc(0, 0, p.s, 0, Math.PI * 2); ctx.fill(); if (p.s > 1.3) { ctx.globalAlpha *= .5; ctx.fillRect(-p.s * 3, -.3, p.s * 6, .6); ctx.fillRect(-.3, -p.s * 3, .6, p.s * 6) } break
      case 'streak': ctx.rotate(Math.atan2(p.vy, p.vx + 0.0001) - Math.PI / 2); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, p.s * 2); ctx.stroke(); break
      case 'ring': ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, p.s, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha *= .6; ctx.beginPath(); ctx.arc(-p.s * .35, -p.s * .35, p.s * .22, 0, Math.PI * 2); ctx.fill(); break
      case 'dragonfly': dragonfly(p, t); break
      case 'crow': crow(p, t); break
    }
    ctx.restore()
  }
  if (SHOOT && !reduced) {
    if (!shooting && Math.random() < .003) shooting = { x: rnd(W * .1, W * .9), y: rnd(0, H * .4), l: 0, a: rnd(2.4, 2.8) }
    if (shooting) {
      shooting.l += 900 * Math.abs(dt)
      const { x, y, l, a } = shooting, x2 = x + Math.cos(a) * l, y2 = y + Math.sin(a) * l
      const g = ctx.createLinearGradient(x, y, x2, y2); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(255,255,255,.9)')
      ctx.strokeStyle = g; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * Math.max(0, l - 220), y + Math.sin(a) * Math.max(0, l - 220)); ctx.lineTo(x2, y2); ctx.stroke()
      if (l > 700) shooting = null
    }
  }
  requestAnimationFrame(frame)
}
addEventListener('resize', resize)
document.addEventListener('visibilitychange', () => { last = performance.now() })
resize(); requestAnimationFrame(frame)
</script>
</body>
</html>
