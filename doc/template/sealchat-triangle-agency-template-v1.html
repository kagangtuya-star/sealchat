<!DOCTYPE html>
<!-- sealchat-triangle-agency-template:v1 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>三角机构角色卡</title>
<script type="application/json" data-sealchat-template-manifest>
{
  "version": 1,
  "sheetType": "ta",
  "label": "三角机构",
  "integration": {
    "provider": "sealdice",
    "probe": {
      "command": ".ta help",
      "matchMode": "contains",
      "expected": "插件按未使用质保的情况结算",
      "timeoutMs": 5000
    },
    "plugin": {
      "name": "三角机构游戏规则（triangle-agency）",
      "acquireText": "请从 GitHub 仓库获取三角机构游戏规则插件，并在 SealDice 中安装启用。",
      "acquireUrl": "https://github.com/oissevalt/sealdice-plugins/blob/main/src/triangle-agency/triangle-agency.ts"
    }
  }
}
</script>
<style>
:root {
  --ink: #2a1d5c;
  --ink-soft: #4d4470;
  --muted: #807a96;
  --paper: #fff;
  --paper-deep: #e9e9ef;
  --panel: #f3f3f7;
  --line: #d6d4e0;
  --soft: #efeef4;
  --red: #d4203c;
  --red-soft: #fbe8eb;
  --blue: #2350b8;
  --blue-soft: #e6ecf9;
  --yellow: #efb21c;
  --yellow-ink: #b98200;
  --yellow-soft: #fdf3d6;
  --radius: 3px;
  --font: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--paper-deep); }
body {
  font-family: var(--font);
  color: var(--ink);
  font-size: 13px;
  line-height: 1.5;
  padding: 10px 10px 84px;
  min-height: 100vh;
  background:
    linear-gradient(rgba(42,29,92,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(42,29,92,.035) 1px, transparent 1px),
    var(--paper-deep);
  background-size: 22px 22px;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .45; }
input, textarea, select { font: inherit; color: inherit; }
code { font-family: Consolas, "Courier New", monospace; font-size: 12px; background: var(--soft); border-radius: 2px; padding: 0 4px; }
.empty { text-align: center; color: var(--muted); padding: 48px 0; }

.sheet {
  max-width: 640px;
  margin: 0 auto;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 4px;
  box-shadow: 0 12px 32px rgba(42,29,92,.12);
  overflow: hidden;
}

/* 色调：C 职能为红、R 现实为黄、A 异常为蓝，与规则书 ARC 配色一致 */
.tone-red { --tc: var(--red); --tc-text: var(--red); --tc-on: #fff; }
.tone-yellow { --tc: var(--yellow); --tc-text: var(--yellow-ink); --tc-on: var(--ink); }
.tone-blue { --tc: var(--blue); --tc-text: var(--blue); --tc-on: #fff; }
.tone-ink { --tc: var(--ink); --tc-text: var(--ink); --tc-on: #fff; }

/* ---------- 卡头 ---------- */
.masthead {
  position: relative;
  min-height: 128px;
  padding: 16px 20px 18px;
  color: #fff;
  background: var(--ink);
  border-bottom: 4px solid var(--red);
  overflow: hidden;
}
.masthead::before, .masthead::after {
  content: ""; position: absolute; width: 0; height: 0;
  border-left: 110px solid transparent;
  border-right: 110px solid transparent;
  border-bottom: 190px solid rgba(212,32,60,.92);
  right: -60px; top: -70px;
  transform: rotate(16deg);
}
.masthead::after {
  border-left-width: 46px; border-right-width: 46px; border-bottom-width: 80px;
  border-bottom-color: rgba(255,255,255,.13);
  right: 120px; top: 62px;
  transform: rotate(44deg);
}
.masthead > * { position: relative; z-index: 1; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
.brand-mark { flex: 0 0 auto; width: 20px; height: 18px; padding: 0; border: 0; background: transparent; cursor: default; outline: none; transition: transform .25s, filter .25s; }
.brand-mark span { display: block; width: 100%; height: 100%; background: var(--red); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
/* 隐藏入口：只在指针悬停时轻微发光闪烁，不做显式标注 */
.brand-mark:hover { cursor: pointer; transform: scale(1.2) rotate(-10deg); filter: drop-shadow(0 0 4px rgba(255,92,112,.95)); animation: mark-flicker 1.6s steps(1) infinite; }
@keyframes mark-flicker { 0%, 44%, 50%, 80%, 86%, 100% { opacity: 1; } 46% { opacity: .35; } 82% { opacity: .6; } }
.brand-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.save-dot { flex: 0 0 auto; margin-left: auto; font-size: 11px; letter-spacing: 0; font-weight: 600; color: #cfc8dc; text-transform: none; white-space: nowrap; }
.save-dot[data-state="pending"] { color: var(--yellow); }
.agent-name {
  margin: 14px 0 10px;
  font-size: clamp(26px, 7vw, 38px);
  font-weight: 900;
  letter-spacing: .04em;
  line-height: 1.15;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.agent-meta { display: flex; flex-wrap: wrap; align-items: center; color: #d8d3e6; font-size: 12px; }
.agent-meta > span + span::before { content: "·"; margin: 0 7px; opacity: .6; }
.meta-arc b { display: inline-grid; place-items: center; width: 16px; height: 16px; margin-right: 4px; border-radius: 2px; font-size: 10px; color: #fff; vertical-align: 1px; }
.meta-arc.a b { background: var(--blue); }
.meta-arc.r b { background: var(--yellow); color: var(--ink); }
.meta-arc.c b { background: var(--red); }

/* ---------- 页签 ---------- */
.tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 2px; padding: 6px 8px; overflow-x: auto; background: rgba(255,255,255,.97); border-bottom: 1px solid var(--line); }
.tab { flex: 0 0 auto; border: 0; border-radius: 2px; padding: 4px 10px; background: transparent; font-size: 12px; font-weight: 800; color: var(--ink-soft); }
.tab:first-child { margin-left: auto; }
.tab:last-child { margin-right: auto; }
.tab:hover { background: var(--soft); }
.tab.active { background: var(--ink); color: #fff; box-shadow: inset 0 -3px 0 var(--red); }

/* ---------- 页面 ---------- */
.page { padding: 16px 18px 20px; }
.page-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 14px; padding-bottom: 6px; border-bottom: 3px solid var(--tc); }
.page-title h1 { font-size: 24px; font-weight: 900; line-height: 1.2; letter-spacing: .06em; color: var(--tc-text); }
.page-title .en { font-size: 10px; font-weight: 800; letter-spacing: .18em; color: var(--muted); text-transform: uppercase; }
.page-title .aside { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.page-title .aside b { font-size: 15px; color: var(--ink); }

/* ---------- 通用 ---------- */
.section-title { display: flex; align-items: center; gap: 8px; margin: 16px 0 8px; font-size: 14px; font-weight: 900; }
.section-title:first-child { margin-top: 2px; }
.section-title::before { content: ""; width: 10px; height: 11px; background: var(--red); clip-path: polygon(0 0, 100% 50%, 0 100%); }
.section-title .en { font-size: 10px; font-weight: 700; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.section-title .aside { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.hint { color: var(--muted); font-size: 12px; }
.note { position: relative; margin-top: 12px; padding: 8px 12px 8px 38px; border: 1.5px solid var(--red); border-radius: var(--radius); background: #fff; font-size: 12px; }
.note::before { content: "!"; position: absolute; left: 10px; top: 8px; display: grid; place-items: center; width: 19px; height: 19px; border-radius: 50%; background: var(--red); color: #fff; font-size: 12px; font-weight: 900; line-height: 1; }
.label { display: block; margin-bottom: 3px; font-size: 11px; font-weight: 900; color: var(--ink); letter-spacing: .06em; }
.field {
  width: 100%; border: 0; border-bottom: 1.5px solid #bdb9cc; border-radius: 0; background: var(--panel);
  padding: 5px 8px; outline: none; transition: border-color .15s, background .15s;
}
.field:focus { border-bottom-color: var(--red); background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
.field::placeholder { color: #a7a2b8; }
textarea.field { resize: vertical; min-height: 52px; }
.grid { display: grid; gap: 8px; }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.full { grid-column: 1 / -1; }
.btn { border: 1.5px solid var(--ink); border-radius: var(--radius); padding: 4px 10px; background: #fff; color: var(--ink); font-size: 12px; font-weight: 800; }
.btn:hover:not(:disabled) { background: var(--ink); color: #fff; }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn.primary:hover:not(:disabled) { background: #b3172f; border-color: #b3172f; }
.btn.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn.confirm, .btn.confirm:hover:not(:disabled) { background: var(--yellow); border-color: var(--yellow); color: var(--ink); }
.btn.ghost { border-style: dashed; color: var(--ink-soft); }
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.stepper { display: inline-flex; align-items: center; gap: 2px; }
.stepper button { width: 22px; height: 22px; border: 1.5px solid var(--ink); border-radius: 2px; background: #fff; font-weight: 900; line-height: 1; }
.stepper button:hover { background: var(--ink); color: #fff; }
.stepper b { min-width: 22px; text-align: center; }
.card { border: 1.5px solid var(--tc, var(--ink)); border-radius: var(--radius); background: #fff; overflow: hidden; }
.card + .card { margin-top: 10px; }
.card-head { display: flex; align-items: center; gap: 8px; padding: 5px 10px; background: var(--tc, var(--ink)); color: var(--tc-on, #fff); font-weight: 900; }
.card-head .title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-head .btn { padding: 1px 8px; border-color: currentColor; background: transparent; color: inherit; }
.card-head .btn:hover:not(:disabled) { background: #fff; color: var(--ink); border-color: #fff; }
.card-body { padding: 10px; }
.remove { border: 0; background: transparent; color: inherit; opacity: .75; font-size: 12px; font-weight: 700; }
.remove:hover { opacity: 1; }
.remove.confirm { opacity: 1; color: #fff; background: var(--ink); border-radius: 2px; padding: 0 6px; }
details.fold { margin-top: 10px; border: 1px dashed var(--line); border-radius: var(--radius); padding: 6px 10px; }
details.fold > summary { cursor: pointer; font-size: 12px; font-weight: 800; color: var(--ink-soft); }
details.fold[open] > summary { margin-bottom: 6px; }
.panel { margin-top: 14px; border: 1.5px solid var(--tc); border-radius: var(--radius); background: #fff; }
.panel-head { display: flex; align-items: baseline; gap: 8px; padding: 5px 10px; background: var(--tc); color: var(--tc-on); font-size: 13px; font-weight: 900; letter-spacing: .04em; }
.panel-head .en { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
.panel-head .aside { margin-left: auto; font-size: 11px; font-weight: 700; opacity: .9; }
.panel-body { padding: 10px; }

/* ---------- 员工档案 ---------- */
.identity { display: grid; grid-template-columns: 156px minmax(0, 1fr); gap: 16px; align-items: start; }
.portrait {
  position: relative; padding: 7px;
  background:
    linear-gradient(135deg, var(--red) 0 15px, transparent 15px),
    linear-gradient(315deg, var(--blue) 0 15px, transparent 15px),
    var(--ink);
  clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
}
.portrait::before, .portrait::after { content: ""; position: absolute; z-index: 2; width: 23px; height: 5px; background: #fff; opacity: .9; }
.portrait::before { top: 12px; right: 9px; }
.portrait::after { bottom: 12px; left: 9px; }
.portrait-media { aspect-ratio: 3 / 4; display: grid; place-items: center; background: var(--soft); overflow: hidden; }
.portrait-media img { width: 100%; height: 100%; object-fit: cover; }
.portrait-empty { color: var(--red); font-size: 46px; line-height: 1; }
.id-kicker { font-size: 10px; font-weight: 900; letter-spacing: .22em; color: var(--ink); }
.id-name { margin-top: 2px; font-size: 22px; font-weight: 900; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.id-rank { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 8px; margin-top: 6px; }
.id-rank .label { margin: 0; }
.arc-bands { display: grid; gap: 6px; margin-top: 10px; }
.arc-band { display: grid; grid-template-columns: 26px 40px minmax(0, 1fr); align-items: center; min-height: 42px; padding: 3px 10px; border-radius: var(--radius); color: #fff; }
.arc-band .letter { font-size: 24px; font-weight: 900; line-height: 1; }
.arc-band .kind { font-size: 12px; font-weight: 900; letter-spacing: .04em; }
.arc-band input { width: 100%; min-width: 0; border: 0; border-left: 1px solid currentColor; background: transparent; color: inherit; font-size: 15px; font-weight: 900; padding: 4px 0 4px 10px; outline: none; }
.arc-band input::placeholder { color: inherit; opacity: .55; font-weight: 700; }
.arc-band input:focus { background: rgba(255,255,255,.16); }
.arc-band.a { background: var(--blue); }
.arc-band.r { background: var(--yellow); color: var(--ink); }
.arc-band.c { background: var(--red); }
.record { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 14px; border: 1.5px solid var(--ink); border-radius: var(--radius); }
.record-cell { display: grid; justify-items: center; gap: 4px; padding: 8px 4px; border-left: 1px solid var(--line); }
.record-cell:first-child { border-left: 0; }
.record-cell .num { font-size: 28px; font-weight: 900; line-height: 1; }
.record-cell .num.red { color: var(--red); }
.record-cell .lbl { font-size: 11px; font-weight: 800; color: var(--ink-soft); }
.record-cell .stepper b { display: none; }
.numbered { display: grid; gap: 6px; }
.numbered-row { display: grid; grid-template-columns: 22px minmax(0, 1fr); align-items: center; gap: 8px; }
.num-dot { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--tc); color: var(--tc-on); font-size: 12px; font-weight: 900; }
.sub-label { display: flex; align-items: baseline; gap: 8px; margin: 10px 0 4px; font-size: 13px; font-weight: 900; color: var(--tc-text); }
.sub-label:first-child { margin-top: 0; }
.sub-label small { font-size: 11px; font-weight: 700; color: var(--muted); }

/* ---------- 资质 ---------- */
.quality-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.quality { border: 1.5px solid var(--ink); border-radius: var(--radius); background: #fff; overflow: hidden; }
.quality.burnout { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
.q-head { display: flex; align-items: center; gap: 6px; padding: 5px 8px; background: var(--red); color: #fff; }
.q-name { flex: 1 1 auto; min-width: 0; font-weight: 900; font-size: 14px; }
.q-name small { display: block; font-size: 9px; font-weight: 700; letter-spacing: .08em; opacity: .8; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q-roll { border: 1px solid rgba(255,255,255,.7); border-radius: 2px; background: transparent; color: #fff; padding: 0 8px; font-size: 11px; font-weight: 800; }
.q-roll:hover { background: #fff; color: var(--red); }
.q-pips { display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; padding: 8px 8px 4px; }
.pip { aspect-ratio: 1; padding: 0; border: 0; background: #ebe9f1; clip-path: polygon(50% 4%, 100% 96%, 0 96%); }
.pip.cap { background: #bcd2f7; }
.pip.on { background: var(--yellow); }
.pip:disabled { opacity: 1; cursor: default; }
.q-foot { display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 0 8px 6px; font-size: 11px; color: var(--ink-soft); }
.q-foot .cur b { font-size: 15px; color: var(--ink); }
.burn-tag { color: var(--red); font-weight: 900; }

/* ---------- 工作/生活 ---------- */
.track { border: 1.5px solid var(--tk); border-radius: var(--radius); overflow: hidden; background: #fff; --tk: var(--red); }
.track + .track { margin-top: 10px; }
.track.reality { --tk: var(--yellow); }
.track.anomaly { --tk: var(--blue); }
.track-head { display: flex; align-items: center; gap: 8px; padding: 5px 10px; background: var(--tk); color: #fff; font-weight: 900; }
.track.reality .track-head { color: var(--ink); }
.track-head .aside { margin-left: auto; font-size: 11px; font-weight: 700; }
.track-scroll { overflow-x: auto; padding: 8px; }
.track-board { min-width: 540px; }
.track-ranks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; }
.track-ranks span { padding: 2px 4px; background: var(--soft); text-align: center; font-size: 10px; font-weight: 800; }
.track-row { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 2px; margin: 2px 0; }
.cell { height: 28px; border: 1.5px solid var(--tk); border-radius: 2px; background: #fff; color: var(--ink-soft); font-size: 11px; font-weight: 900; padding: 0; }
.cell.marked { background: var(--tk); color: #fff; }
.track.reality .cell.marked { color: var(--ink); }
.cell.crossed { background: var(--ink); border-color: var(--ink); color: #fff; }

/* ---------- 人际关系 ---------- */
.conn { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.conn-pips { display: inline-flex; gap: 2px; }
.conn-pip { width: 18px; height: 18px; padding: 0; border: 1.5px solid var(--yellow-ink); border-radius: 2px; background: #fff; }
.conn-pip.on { background: var(--yellow); }
.tag { display: inline-block; padding: 0 6px; border-radius: 2px; font-size: 11px; font-weight: 800; }
.tag.net { background: var(--yellow); color: var(--ink); }
.tag.lost { background: var(--red-soft); color: var(--red); }

/* ---------- 速查 ---------- */
.ref p { margin: 4px 0; }
.ref table { width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 12px; border: 1.5px solid var(--ink); }
.ref td { border-top: 1px solid var(--line); padding: 4px 6px; vertical-align: top; }
.ref td:first-child { white-space: nowrap; background: var(--panel); border-right: 1px solid var(--line); }

/* ---------- 悬浮按钮与弹窗 ---------- */
.fab { position: fixed; right: 16px; bottom: 16px; z-index: 20; width: 66px; height: 58px; padding: 0; border: 0; background: transparent; filter: drop-shadow(0 6px 10px rgba(212,32,60,.35)); }
.fab span { display: flex; align-items: flex-end; justify-content: center; width: 100%; height: 100%; padding-bottom: 8px; background: var(--red); color: #fff; font-size: 13px; font-weight: 900; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.fab:hover { transform: translateY(-2px); }
.modal-overlay { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; padding: 14px; background: rgba(23,13,40,.6); }
.modal-overlay.open { display: grid; }
.modal { width: min(440px, 100%); max-height: calc(100vh - 28px); overflow-y: auto; border: 2px solid var(--ink); border-radius: 4px; background: #fff; box-shadow: 0 14px 38px rgba(42,29,92,.25); }
.modal-head { padding: 10px 14px; background: var(--ink); color: #fff; border-bottom: 4px solid var(--red); }
.modal-head .kicker { font-size: 11px; color: #cfc8dc; }
.modal-head strong { display: block; font-size: 18px; }
.modal-body { padding: 12px 16px 16px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1.5px solid var(--line); border-radius: 2px; padding: 2px 9px; background: #fff; font-size: 12px; font-weight: 800; }
.seg button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.check { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 6px; }
.preview { margin-top: 10px; padding: 6px 8px; border-left: 3px solid var(--red); background: var(--panel); font-size: 12px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 12px; }
.modal-error { margin-top: 10px; color: var(--red); font-size: 12px; font-weight: 800; }
.settle-block { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.settle-block:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.refill-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 2px 0; font-size: 12px; }
.toast { position: fixed; left: 50%; bottom: 20px; z-index: 80; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; max-width: calc(100% - 32px); padding: 6px 14px; border-radius: 2px; background: var(--ink); color: #fff; font-size: 12px; transition: .2s; }
.toast.show { transform: translate(-50%, 0); opacity: 1; }

/* ---------- 受限文档 ---------- */
.vault-overlay { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; padding: 14px; overflow-y: auto; background: rgba(23,13,40,.72); }
.vault-overlay.open { display: grid; }
.vault-overlay.doc {
  place-items: start center;
  background:
    linear-gradient(rgba(42,29,92,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(42,29,92,.04) 1px, transparent 1px),
    #e6e5ec;
  background-size: 22px 22px;
}
.vd { width: min(380px, 100%); border: 2px solid var(--ink); border-radius: 4px; background: #fff; box-shadow: 0 16px 40px rgba(0,0,0,.3); }

<script>
var _windowId = null;
var _rollDispatchMode = 'default';
function postEvent(action, payload) {
  if (!_windowId) return;
  window.parent.postMessage({ type: 'SEALCHAT_EVENT', version: 1, windowId: _windowId, action: action, payload: payload }, '*');
}
window.sealchat = {
  onUpdate: function(cb) {
    window.addEventListener('message', function(e) {
      if (e.source !== window.parent) return;
      if (e.data && e.data.type === 'SEALCHAT_UPDATE') { _windowId = e.data.payload.windowId; cb(e.data.payload); }
    });
  },
  setRollDispatchMode: function(mode) { _rollDispatchMode = mode === 'template' ? 'template' : 'default'; },
  setRollMode: function(mode) { _rollDispatchMode = mode === 'template' ? 'template' : 'default'; },
  roll: function(template, label, args) {
    postEvent('ROLL_DICE', { roll: { template: template, label: label || '', args: args || {}, dispatchMode: _rollDispatchMode } });
  },
  updateAttrs: function(attrs) { postEvent('UPDATE_ATTRS', { attrs: attrs }); }
};
// 检定与资源变动由人物卡组装好完整的 .ta/.tr/.tra/.st 等指令后直接发送，交给 SealDice 社区插件 triangle-agency 处理。
window.sealchat.setRollDispatchMode('template');
</script>

<script>
// ============================================================
// 数据层
// ============================================================
var DATA_KEY = '$三角机构';
var MODEL_VERSION = 1;
var QA_MAX = 9;
var CONNECTION_MAX = 9;
var RECENT_GUARD_MS = 2500;
var CONFIRM_MS = 3000;
var QA_PENDING_MS = 120000;
var QA_PENDING_LIMIT = 32;

// 九项资质与社区插件 triangle-agency 的规则模板 ta 同名：根级数值即当前资质保证（QA），插件检定时直接读取。
var QUALITIES = [
  { key: '专注', en: 'Attentiveness' },
  { key: '共情', en: 'Empathy' },
  { key: '气场', en: 'Presence' },
  { key: '欺瞒', en: 'Duplicity' },
  { key: '主动', en: 'Initiative' },
  { key: '专业', en: 'Professionalism' },
  { key: '活力', en: 'Dynamism' },
  { key: '坚毅', en: 'Persistence' },
  { key: '诡秘', en: 'Subtlety' }
];
var QUALITY_KEYS = QUALITIES.map(function(q) { return q.key; });
function maxKey(q) { return q + '上限'; }

// 根级属性：资质当前 QA 与上限、嘉奖、申诫。其余内容保存在 $三角机构 中，不进入 .st 的属性列表。
var ROOT_DEFAULTS = { '嘉奖': 0, '申诫': 0 };
QUALITY_KEYS.forEach(function(q) { ROOT_DEFAULTS[q] = 0; ROOT_DEFAULTS[maxKey(q)] = 0; });

// 旧版自制三角机构人物卡（$TriangleAgency，配合自制插件）使用的根级键名 → 当前键名。
var LEGACY_DATA_KEY = '$TriangleAgency';
var LEGACY_QUALITY_KEYS = { '缜密': '专注', '坚持': '坚毅', '气质': '气场', '低调': '诡秘' };
var LEGACY_ROOT_KEYS = { '处分': '申诫' };
for (var lk in LEGACY_QUALITY_KEYS) {
  LEGACY_ROOT_KEYS[lk] = LEGACY_QUALITY_KEYS[lk];
  LEGACY_ROOT_KEYS[maxKey(lk)] = maxKey(LEGACY_QUALITY_KEYS[lk]);
}

// 工作/生活平衡表：每条两行各 15 格，上行从左向右、下行从右向左；格内代码为游戏高墙文件编号。
var TRACK_LEN = 15;
var TRACKS = {
  competency: {
    name: '职能', en: 'Competency',
    topRanks: ['培训生', '助理', '高级助理', '副主任', '主任'],
    bottomRanks: ['董事长', '执行副总裁', '高级经理', '副总裁', '区域总监'],
    top: ['', '', 'A3', '', '', 'D4', '', '', 'G3', '', '', 'J3', '', '', 'N3'],
    bottom: ['', '', '', 'Y2', '', '', 'W8', '', '', 'T3', '', '', 'Q3', '', '']
  },
  reality: {
    name: '现实', en: 'Reality',
    top: ['C4', '', '', 'L11', '', '', '', 'E2', '', 'O4', '', '', '', 'T6', ''],
    bottom: ['', '', '', '', 'E3', '', '', '', 'H5', '', 'X3', '', '', '', 'V2']
  },
  anomaly: {
    name: '异常', en: 'Anomaly',
    top: ['H4', 'H3', '', '', 'U2', '', 'X2', '', '', '', 'N1', '', 'Q2', '', ''],
    bottom: ['', '', '', '', '', '', '', 'A7', '', '', '', 'G8', '', 'L10', '']
  }
};
var TRACK_KEYS = ['competency', 'reality', 'anomaly'];

var QUESTIONS = [
  '你最初是如何接触到你的异常体的？',
  '机构是如何找到你的？',
  '你的年薪是多少？',
  '你的外貌如何？',
  '你的能力有独特的外在视觉表现吗？',
  '你喝什么咖啡？',
  '在你的人际关系中，谁是你的主要联系人？为什么？',
  '在协作的工作环境中，你能带来什么？',
  '请列出你之前的工作经历。'
];
var CUSTOM_QUESTION_COUNT = 3;
var QUESTION_COUNT = QUESTIONS.length + CUSTOM_QUESTION_COUNT;

function blankAnomaly() { return { name: '', quality: '', trigger: '', success: '', extra: '', failure: '', practice: '' }; }
function blankRelation() { return { name: '', player: '', connection: 1, bonus: '', note: '' }; }
function blankLane() { var out = []; for (var i = 0; i < TRACK_LEN; i++) out.push(0); return out; }
function blankStrings(n) { var out = []; for (var i = 0; i < n; i++) out.push(''); return out; }
function blankModel() {
  var tracks = {};
  TRACK_KEYS.forEach(function(k) { tracks[k] = { top: blankLane(), bottom: blankLane() }; });
  return {
    version: MODEL_VERSION,
    arc: { anomaly: '', reality: '', competency: '' },
    profile: { rank: '', realityTrigger: '', burnoutRelease: '', primeDirective: '', sanctioned: blankStrings(3), requisitions: '', notes: '' },
    record: { mvp: 0, probation: 0 },
    anomalies: [blankAnomaly(), blankAnomaly(), blankAnomaly()],
    relationships: [blankRelation(), blankRelation(), blankRelation()],
    tracks: tracks,
    questionnaire: blankStrings(QUESTION_COUNT),
    customQuestions: blankStrings(CUSTOM_QUESTION_COUNT),
    // 受限文档：密钥只存摘要，内容仍以明文存在人物卡数据里。
    restricted: { keyHash: '', docNo: '', body: '' }
  };
}

function isObj(v) { return v && typeof v === 'object' && !Array.isArray(v); }
function str(v) { return v == null ? '' : String(v); }
function toInt(v, fallback) {
  if (typeof v === 'number' && isFinite(v)) return Math.trunc(v);
  var m = String(v == null ? '' : v).trim().replace(/＋/g, '+').replace(/[－—]/g, '-').match(/^[+-]?\d+/);
  return m ? Number(m[0]) : (fallback == null ? 0 : fallback);
}
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
function clone(v) { return JSON.parse(JSON.stringify(v)); }
function fixedStrings(list, n) {
  var out = (Array.isArray(list) ? list : []).slice(0, n).map(str);
  while (out.length < n) out.push('');
  return out;
}
function fixedLane(list) {
  var out = (Array.isArray(list) ? list : []).slice(0, TRACK_LEN).map(function(v) { return clamp(toInt(v, 0), 0, 2); });
  while (out.length < TRACK_LEN) out.push(0);
  return out;
}

// 按模板默认结构补齐字段，并丢弃类型不符的值，保证渲染时不必逐处判空。
function merge(target, source) {
  for (var k in target) {
    if (!(k in source)) continue;
    var tv = target[k], sv = source[k];
    if (Array.isArray(tv)) { if (Array.isArray(sv)) target[k] = sv; }
    else if (isObj(tv)) { if (isObj(sv)) merge(tv, sv); }
    else if (typeof tv === 'number') target[k] = toInt(sv, tv);
    else target[k] = str(sv);
  }
}
function normalize(raw) {
  var out = blankModel();
  if (!isObj(raw)) return out;
  merge(out, raw);
  out.version = MODEL_VERSION;
  out.profile.sanctioned = fixedStrings(out.profile.sanctioned, 3);
  out.anomalies = out.anomalies.filter(isObj).map(function(a) {
    var b = blankAnomaly(); merge(b, a);
    if (QUALITY_KEYS.indexOf(b.quality) < 0) b.quality = '';
    return b;
  });
  out.relationships = out.relationships.filter(isObj).map(function(r) {
    var b = blankRelation(); merge(b, r);
    b.connection = clamp(b.connection, 0, CONNECTION_MAX);
    return b;
  });
  TRACK_KEYS.forEach(function(k) {
    var t = out.tracks[k];
    out.tracks[k] = { top: fixedLane(isObj(t) && t.top), bottom: fixedLane(isObj(t) && t.bottom) };
  });
  out.questionnaire = fixedStrings(out.questionnaire, QUESTION_COUNT);
  out.customQuestions = fixedStrings(out.customQuestions, CUSTOM_QUESTION_COUNT);
  return out;
}

function parseModel(value) {
  if (isObj(value)) return value;
  if (typeof value === 'string' && value.charAt(0) === '{') {
    try { return JSON.parse(value); } catch (e) { return null; }
  }
  return null;
}

// ---------- 旧版自制人物卡迁移 ----------
function legacyQuality(text) {
  var q = str(text).trim();
  if (LEGACY_QUALITY_KEYS[q]) return LEGACY_QUALITY_KEYS[q];
  return QUALITY_KEYS.indexOf(q) >= 0 ? q : '';
}
function migrateLegacy(old, attrs) {
  var m = blankModel();
  var p = isObj(old.profile) ? old.profile : {};
  m.arc.anomaly = str(p.anomaly);
  m.arc.reality = str(p.reality);
  m.arc.competency = str(p.competency);
  m.profile.rank = str(attrs['职级'] != null ? attrs['职级'] : p.rank);
  m.profile.realityTrigger = str(p.realityTrigger);
  m.profile.burnoutRelease = str(p.burnRelease);
  m.profile.primeDirective = str(p.highestDirective);
  m.profile.sanctioned = fixedStrings(p.authorizedActions, 3);
  m.profile.requisitions = str(p.supplies) || [p.initialSupplies, p.extraSupplies].map(str).filter(Boolean).join('\n');
  // 代号与机构信誉等级没有对应栏位，保留到备注。
  var reputation = attrs['机构信誉等级'] != null ? attrs['机构信誉等级'] : p.reputation;
  m.profile.notes = [p.code && '代号：' + p.code, reputation && '机构信誉等级：' + reputation].filter(Boolean).join('\n');
  var c = isObj(old.counters) ? old.counters : {};
  m.record.mvp = Math.max(0, toInt(c.mvp, 0));
  m.record.probation = Math.max(0, toInt(c.probation, 0));

  var anomalies = (Array.isArray(old.anomalies) ? old.anomalies : []).filter(isObj).map(function(a) {
    var b = blankAnomaly();
    b.name = str(a.ability) || str(a.name);
    b.quality = legacyQuality(a.quality);
    b.trigger = str(a.trigger);
    if (!b.quality && str(a.quality).trim()) b.trigger = '使用资质：' + str(a.quality).trim() + (b.trigger ? '\n' + b.trigger : '');
    b.success = str(a.success);
    b.failure = str(a.failure);
    b.practice = str(a.practiced);
    return b;
  });
  if (anomalies.length) m.anomalies = anomalies;

  var relations = (Array.isArray(old.relationships) ? old.relationships : []).filter(function(r) {
    return isObj(r) && (str(r.name) || str(r.player) || str(r.reward) || str(r.summary));
  }).map(function(r) {
    return { name: str(r.name), player: str(r.player), connection: clamp(toInt(r.connection, 0), 0, CONNECTION_MAX), bonus: str(r.reward), note: str(r.summary) };
  });
  if (relations.length) m.relationships = relations;

  var tracks = isObj(old.tracks) ? old.tracks : {};
  TRACK_KEYS.forEach(function(k) {
    var t = tracks[k];
    if (Array.isArray(t)) t = { top: t };
    if (isObj(t)) m.tracks[k] = { top: fixedLane(t.top), bottom: fixedLane(t.bottom) };
  });
  m.questionnaire = fixedStrings(old.questionnaire, QUESTION_COUNT);
  // 旧版自定义问题带有占位文字，迁移时清空。
  m.customQuestions = fixedStrings(old.customQuestions, CUSTOM_QUESTION_COUNT).map(function(q) {
    return /^基于您的现实身份的额外问题 \d$/.test(q) ? '' : q;
  });

  // 只补写卡上尚不存在的属性：插件或 .st 已维护的新格式数值优先。
  var root = {};
  for (var oldKey in LEGACY_ROOT_KEYS) {
    var newKey = LEGACY_ROOT_KEYS[oldKey];
    if (attrs[oldKey] != null && attrs[newKey] == null) root[newKey] = toInt(attrs[oldKey], 0);
  }
  var qualities = isObj(old.qualities) ? old.qualities : {};
  for (var name in qualities) {
    var key = legacyQuality(name);
    if (!key || !isObj(qualities[name])) continue;
    if (attrs[key] == null && root[key] == null) root[key] = toInt(qualities[name].current, 0);
    if (attrs[maxKey(key)] == null && root[maxKey(key)] == null) root[maxKey(key)] = toInt(qualities[name].max, 0);
  }
  return { root: root, model: m };
}

// ============================================================
// 状态与保存
// ============================================================
var S = {
  name: '',
  avatarUrl: '',
  attrs: {},
  model: null,
  ready: false,
  tab: 'profile',
  pendingRoot: {},
  modelDirty: false,
  // 卡上还没有三角机构数据：先以默认值显示，首次编辑时再写入，避免打开即覆盖宿主尚未加载的属性。
  needsInit: false,
  saveTimer: null,
  composing: false,
  deferredRender: false,
  saveState: 'idle',
  recent: null,
  qaPending: {},
  ui: { confirm: null, confirmUntil: 0 },
  modal: null,
  // 受限文档：null 或 { stage: 'setup' | 'access' | 'open', rekey, error }
  vault: null
};

function rootNum(key) {
  var v = S.attrs[key];
  var d = ROOT_DEFAULTS[key] || 0;
  return v == null || v === '' ? d : toInt(v, d);
}
function qaState(q) {
  return { current: rootNum(q), max: clamp(rootNum(maxKey(q)), 0, QA_MAX) };
}

function setRoots(patch, immediate) {
  // 绝对值编辑与在途相对指令不能仅凭数值归因，须核对后再继续结算。
  for (var q in patch) {
    var p = S.qaPending[q];
    if (!p) continue;
    if (p.steps.length || p.blocked) { blockPending(p); p.host = null; }
    else { clearTimeout(p.timer); delete S.qaPending[q]; }
  }
  for (var k in patch) { S.attrs[k] = patch[k]; S.pendingRoot[k] = patch[k]; }
  scheduleSave(immediate);
}
function setRoot(key, value, immediate) {
  var patch = {};
  patch[key] = value;
  setRoots(patch, immediate);
}
function touchModel(immediate) {
  S.modelDirty = true;
  scheduleSave(immediate);
}

function getPath(obj, path) {
  var parts = path.split('.');
  for (var i = 0; i < parts.length; i++) { if (obj == null) return undefined; obj = obj[parts[i]]; }
  return obj;
}
function setPath(obj, path, value) {
  var parts = path.split('.');
  for (var i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];
  var last = parts[parts.length - 1];
  obj[last] = typeof obj[last] === 'number' ? toInt(value, 0) : value;
}

function scheduleSave(immediate) {
  setSaveState('pending');
  if (S.saveTimer) clearTimeout(S.saveTimer);
  if (immediate) { flushSave(); return; }
  S.saveTimer = setTimeout(flushSave, 1200);
}
function flushSave() {
  if (S.saveTimer) { clearTimeout(S.saveTimer); S.saveTimer = null; }
  if (S.composing) { S.saveTimer = setTimeout(flushSave, 600); return; }
  // 没有真实待保存的修改时直接返回：切页、隐藏页面等补交不应写入空白卡。
  if (!S.modelDirty && !Object.keys(S.pendingRoot).length) { setSaveState('saved'); return; }
  var patch = {};
  if (S.needsInit && S.model) {
    for (var d in ROOT_DEFAULTS) if (S.attrs[d] == null) { patch[d] = ROOT_DEFAULTS[d]; S.attrs[d] = ROOT_DEFAULTS[d]; }
    S.modelDirty = true;
    S.needsInit = false;
  }
  for (var k in S.pendingRoot) patch[k] = S.pendingRoot[k];
  if (S.modelDirty && S.model) {
    patch[DATA_KEY] = clone(S.model);
    S.attrs[DATA_KEY] = patch[DATA_KEY];
  }
  S.pendingRoot = {};
  S.modelDirty = false;
  var guard = S.recent && Date.now() < S.recent.until ? S.recent.patch : {};
  for (var g in patch) guard[g] = patch[g];
  S.recent = { patch: guard, until: Date.now() + RECENT_GUARD_MS };
  window.sealchat.updateAttrs(patch);
  setSaveState('saved');
}
function setSaveState(state) {
  S.saveState = state;
  var dot = document.getElementById('saveDot');
  if (dot) { dot.dataset.state = state; dot.textContent = state === 'pending' ? '待保存' : (state === 'saved' ? '已保存' : ''); }
}

function isEditing() {
  var el = document.activeElement;
  if (!el) return false;
  var inSheet = document.getElementById('app').contains(el) || document.getElementById('modal').contains(el) || document.getElementById('vault').contains(el);
  return inSheet && (el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type !== 'checkbox'));
}

function sameValue(a, b) {
  if (a == null || b == null) return a == b;
  if (typeof a === 'object' || typeof b === 'object') return JSON.stringify(a) === JSON.stringify(b);
  return String(a) === String(b);
}

function onHostUpdate(data) {
  S.name = data && data.name || '';
  S.avatarUrl = data && data.avatarUrl || '';
  var incoming = data && data.attrs || {};
  var attrs = {};
  for (var k in incoming) attrs[k] = incoming[k];
  // 尚未提交或刚提交的本地编辑优先于宿主回显，避免旧快照覆盖刚输入的内容。
  // 宿主回显与已保存值一致即视为确认，之后该键不再拦截（SealDice 随后的写入可正常显示）。
  if (S.recent && Date.now() < S.recent.until) {
    for (var r in S.recent.patch) {
      if (sameValue(incoming[r], S.recent.patch[r])) delete S.recent.patch[r];
      else attrs[r] = S.recent.patch[r];
    }
  }
  for (var p in S.pendingRoot) attrs[p] = S.pendingRoot[p];
  S.attrs = attrs;
  // 使用原始宿主快照核销；即使正在编辑、暂缓重绘，也不能漏掉中间回写。
  for (var q in S.qaPending) reconcilePending(q, incoming[q]);

  // 尚未写入的空白卡也继续检查：宿主稍后才送达的已有数据优先于默认值。
  if (!S.modelDirty) {
    var raw = parseModel(attrs[DATA_KEY]);
    var legacy = raw ? null : parseModel(attrs[LEGACY_DATA_KEY]);
    S.needsInit = false;
    if (raw) {
      S.model = normalize(raw);
    } else if (legacy) {
      var migrated = migrateLegacy(legacy, attrs);
      S.model = migrated.model;
      setRoots(migrated.root);
      touchModel(true);
    } else {
      S.model = blankModel();
      S.needsInit = true;
    }
  }
  S.ready = true;
  if (isEditing()) { S.deferredRender = true; return; }
  render();
  if (S.modal) renderModal();
  if (S.vault && S.vault.stage === 'open') renderVault();
}

function esc(text) {
  return str(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function pathInput(path, placeholder) {
  return '<input class="field" data-path="' + esc(path) + '" value="' + esc(getPath(S.model, path)) + '" placeholder="' + esc(placeholder || '') + '">';
}
function pathArea(path, placeholder, rows) {
  return '<textarea class="field" data-path="' + esc(path) + '" rows="' + (rows || 2) + '" placeholder="' + esc(placeholder || '') + '">' + esc(getPath(S.model, path)) + '</textarea>';
}
function labeled(label, html, cls) {
  return '<div class="' + (cls || '') + '"><span class="label">' + esc(label) + '</span>' + html + '</div>';
}
function qualitySelect(path) {
  var cur = getPath(S.model, path);
  var html = '<select class="field" data-path="' + esc(path) + '"><option value="">—</option>';
  QUALITY_KEYS.forEach(function(q) { html += '<option value="' + q + '"' + (cur === q ? ' selected' : '') + '>' + q + '</option>'; });
  return html + '</select>';
}
function pageTitle(cn, en, aside) {
  return '<div class="page-title"><h1>' + esc(cn) + '</h1>' + (en ? '<span class="en">' + esc(en) + '</span>' : '') + (aside ? '<span class="aside">' + aside + '</span>' : '') + '</div>';
}
// tone 对应规则书的 ARC 配色：red = 职能，yellow = 现实，blue = 异常。
function panel(tone, cn, en, body, aside) {
  return '<section class="panel tone-' + tone + '"><div class="panel-head"><span>' + esc(cn) + '</span>' + (en ? '<span class="en">' + esc(en) + '</span>' : '') + (aside ? '<span class="aside">' + aside + '</span>' : '') + '</div>'
    + '<div class="panel-body">' + body + '</div></section>';
}
function subLabel(text, small) {
  return '<div class="sub-label">' + esc(text) + (small ? '<small>' + esc(small) + '</small>' : '') + '</div>';
}
function sectionTitle(cn, en, aside) {
  return '<div class="section-title">' + esc(cn) + (en ? ' <span class="en">' + esc(en) + '</span>' : '') + (aside ? '<span class="aside">' + aside + '</span>' : '') + '</div>';
}
function stepper(act, attrs, value) {
  return '<span class="stepper"><button data-act="' + act + '" ' + attrs + ' data-delta="-1">−</button><b>' + value + '</b><button data-act="' + act + '" ' + attrs + ' data-delta="1">+</button></span>';
}
function isConfirming(key) { return S.ui.confirm === key && Date.now() < S.ui.confirmUntil; }
// 需要二次确认的按钮：第一次点击进入确认，时限内再点一次才执行。
function confirmClick(key) {
  if (isConfirming(key)) { S.ui.confirm = null; return true; }
  S.ui.confirm = key;
  S.ui.confirmUntil = Date.now() + CONFIRM_MS;
  setTimeout(function() { if (S.ui.confirm === key && Date.now() >= S.ui.confirmUntil) { S.ui.confirm = null; render(); } }, CONFIRM_MS + 50);
  return false;
}
// 角色名以 SealChat 人物卡名称为准，保证卡内与平台显示一致。
function displayName() { return S.name || '未命名特工'; }

// [键, 页签名, 页面配色]
var TAB_LIST = [
  ['profile', '员工档案', 'ink'],
  ['qa', '资质保证', 'red'],
  ['anomaly', '异常能力', 'blue'],
  ['relations', '人际关系', 'yellow'],
  ['worklife', '工作生活', 'ink'],
  ['onboarding', '入职问卷', 'ink'],
  ['ref', '规则速查', 'ink']
];

function render() {
  S.deferredRender = false;
  var app = document.getElementById('app');
  if (!S.ready || !S.model) return;
  var tab = TAB_LIST.filter(function(t) { return t[0] === S.tab; })[0] || TAB_LIST[0];
  var html = '<div class="sheet">' + renderHeader();
  html += '<nav class="tabs">' + TAB_LIST.map(function(t) {
    return '<button class="tab' + (S.tab === t[0] ? ' active' : '') + '" data-act="tab" data-tab="' + t[0] + '">' + t[1] + '</button>';
  }).join('') + '</nav>';
  html += '<main class="page tone-' + tab[2] + '">';
  if (S.tab === 'qa') html += renderQualities();
  else if (S.tab === 'profile') html += renderProfile();
  else if (S.tab === 'anomaly') html += renderAnomalies();
  else if (S.tab === 'relations') html += renderRelations();
  else if (S.tab === 'worklife') html += renderWorklife();
  else if (S.tab === 'onboarding') html += renderOnboarding();
  else html += renderRef();
  html += '</main></div><button class="fab" data-act="roll" title="请求机构：投掷 6d4"><span>6d4</span></button>';
  app.innerHTML = html;
  setSaveState(S.saveState);
}

function renderHeader() {
  var arc = S.model.arc;
  function seg(cls, letter, value) {
    return value ? '<span class="meta-arc ' + cls + '"><b>' + letter + '</b>' + esc(value) + '</span>' : '';
  }
  var arcs = seg('a', 'A', arc.anomaly) + seg('r', 'R', arc.reality) + seg('c', 'C', arc.competency);
  var rank = S.model.profile.rank;
  return '<header class="masthead">'
    + '<div class="brand"><button class="brand-mark" data-act="vault" tabindex="-1" aria-label="受限文档"><span></span></button><span class="brand-text">Triangle Agency / Personnel Record</span><span class="save-dot" id="saveDot"></span></div>'
    + '<div class="agent-name" title="与 SealChat 人物卡名称同步">' + esc(displayName()) + '</div>'
    + '<div class="agent-meta">' + (arcs || '<span>人力资源档案 · 授权员工访问</span>')
    + (rank ? '<span>' + esc(rank) + '</span>' : '') + '</div>'
    + '</header>';
}

function renderQualities() {
  var cur = 0, max = 0;
  var cards = QUALITIES.map(function(q) {
    var st = qaState(q.key);
    cur += Math.max(0, st.current);
    max += st.max;
    var pips = '';
    for (var i = 1; i <= QA_MAX; i++) {
      var cls = 'pip' + (i <= st.max ? ' cap' : '') + (i <= st.current ? ' on' : '');
      pips += '<button class="' + cls + '" data-act="qa-pip" data-quality="' + q.key + '" data-index="' + i + '"' + (i > st.max ? ' disabled' : '') + ' title="' + (i > st.max ? '超出上限' : '设置当前 QA 为 ' + i) + '"></button>';
    }
    var burnout = st.current <= 0;
    return '<div class="quality' + (burnout ? ' burnout' : '') + '">'
      + '<div class="q-head"><span class="q-name">' + q.key + '<small>' + q.en + '</small></span><button class="q-roll" data-act="roll" data-quality="' + q.key + '">检定</button></div>'
      + '<div class="q-pips">' + pips + '</div>'
      + '<div class="q-foot"><span class="cur"><b>' + st.current + '</b>/' + st.max + (burnout ? ' <span class="burn-tag">过载</span>' : '') + '</span>'
      + '<span title="QA 上限">上限 ' + stepper('qa-max', 'data-quality="' + q.key + '"', st.max) + '</span></div>'
      + '</div>';
  }).join('');
  var restKey = 'rest';
  var html = pageTitle('资质保证', 'Quality Assurance', 'QA 合计 <b>' + cur + '</b> / ' + max);
  html += '<div class="quality-grid">' + cards + '</div>';
  html += '<div class="btn-row">'
    + '<button class="btn" data-act="cmd" data-cmd=".tcs">查询混沌点数</button>'
    + '<button class="btn" data-act="cmd" data-cmd=".tfs">查询改写失败次数</button>'
    + '<button class="btn' + (isConfirming(restKey) ? ' confirm' : '') + '" data-act="rest">' + (isConfirming(restKey) ? '再点确认恢复' : '恢复资质到上限') + '</button>'
    + '</div>';
  return html;
}

function arcBand(cls, letter, kind, path, placeholder) {

function recordCell(label, value, act, attrs, red) {

  var html = pageTitle('人际关系', 'Relationships', '关系网 <b>' + network + '</b> 人');
  html += list.map(function(r, i) {
    var p = 'relationships.' + i + '.';
    var removeKey = 'relation-' + i;
    var pips = '';
    for (var n = 1; n <= CONNECTION_MAX; n++) pips += '<button class="conn-pip' + (n <= r.connection ? ' on' : '') + '" data-act="conn-pip" data-index="' + i + '" data-value="' + n + '" title="连结 ' + n + '"></button>';
    var tag = r.connection >= CONNECTION_MAX ? '<span class="tag net">已入关系网</span>' : (r.connection <= 0 ? '<span class="tag lost">已失去</span>' : '');
    return '<div class="card"><div class="card-head"><span class="title">' + esc(r.name || '未命名关系') + '</span>'
      + '<button class="remove' + (isConfirming(removeKey) ? ' confirm' : '') + '" data-act="list-remove" data-list="relationships" data-index="' + i + '">' + (isConfirming(removeKey) ? '确认删除' : '删除') + '</button></div>'

  html += '<div class="note">连结达到 9 时加入关系网；降至 0 时失去这段关系。</div>';
  return html;
}

function trackRow(key, lane, codes, arrow) {
  var states = S.model.tracks[key][lane];
  return '<div class="track-row">' + codes.map(function(code, i) {
    var st = states[i];
    var text = st === 2 ? '×' : (st === 1 ? (code || '●') : arrow);
    return '<button class="cell' + (st === 1 ? ' marked' : (st === 2 ? ' crossed' : '')) + '" data-act="cell" data-track="' + key + '" data-lane="' + lane + '" data-index="' + i + '" title="点击切换：空白 → 已标记 → 已划掉">' + esc(text) + '</button>';
  }).join('') + '</div>';
}
function rankRow(labels) {
  return labels ? '<div class="track-ranks">' + labels.map(function(l) { return '<span>' + esc(l) + '</span>'; }).join('') + '</div>' : '';
}
function renderWorklife() {
  var used = 0;
  var html = '';
  TRACK_KEYS.forEach(function(key) {
    var conf = TRACKS[key];
    var lanes = S.model.tracks[key].top.concat(S.model.tracks[key].bottom);
    var marked = lanes.filter(function(v) { return v === 1; }).length;
    var crossed = lanes.filter(function(v) { return v === 2; }).length;
    used += marked;
    html += '<section class="track ' + key + '"><div class="track-head">' + conf.name + ' <span class="en" style="font-size:10px;letter-spacing:.1em">' + conf.en.toUpperCase() + '</span><span class="aside">已标记 ' + marked + ' · 已划掉 ' + crossed + '</span></div>'
      + '<div class="track-scroll"><div class="track-board">'
      + rankRow(conf.topRanks) + trackRow(key, 'top', conf.top, '▷') + trackRow(key, 'bottom', conf.bottom, '◁') + rankRow(conf.bottomRanks)
      + '</div></div></section>';
  });
  return pageTitle('工作/生活平衡', 'Work / Life Balance', '已消耗时间 <b>' + used + '</b> / 30')
    + html
    + '<div class="note">消耗时间时，在所选条上标记最靠前的空白格，再在另一条上划掉最后一个空白格。格子标记后显示其游戏高墙文件代码。</div>';
}

}

  if (act === 'm-clear') {
    var left = Math.max(0, settleCurrent(m.quality));
    var quality = m.quality;
    if (!left || !canAdjust(quality, -left)) return;
    modalSend(['.st ' + quality + '-' + left], '清空 QA', function() {
      m.spent += left;
      m.spend = 0;
      toast('已发送清空' + m.quality + ' QA');
    }, function() {
      if (!canAdjust(quality, -left)) return false;
      notePending(m, quality, -left);
      return true;
    });
    return;
  }
  if (act === 'm-refill') {
    var rq = d.quality;
    if (qaBlocked(rq)) return;
    var st = qaState(rq);
    var room = Math.max(0, st.max - settleCurrent(rq));
    var total = 0;
    for (var k in m.refill) total += m.refill[k];
    var next = (m.refill[rq] || 0) + Number(d.delta);
    if (next < 0 || next > room || (Number(d.delta) > 0 && total >= 3)) return;
    if (next) m.refill[rq] = next; else delete m.refill[rq];
    renderModal();
    return;
  }
  if (act === 'm-refill-send') {
    // 逐项发送相对调整，避免与尚未回写的花费互相覆盖。
    var refill = clone(m.refill);
    var cmds = [];
    for (var fq in refill) cmds.push('.st ' + fq + '+' + refill[fq]);
    if (!cmds.length) return;
    modalSend(cmds, '稍后重议', function() {
      if (refill[m.quality]) m.spent = Math.max(0, m.spent - refill[m.quality]);
      m.refill = {};
      toast('已发送补回 QA');
    }, function() {
      var total = 0;
      for (var rq in refill) {
        if (!canAdjust(rq, refill[rq])) return false;
        total += refill[rq];
      }
      if (total > 3) return false;
      for (var rq in refill) notePending(m, rq, refill[rq]);
      return true;
    });
    return;
  }
  if (act === 'm-star') { modalSend(['.st 嘉奖+3'], '此刻之星', function() { toast('已发送嘉奖 +3'); }); return; }
}

document.addEventListener('input', function(e) {
  var el = e.target;
  if (el.dataset.mcheck && S.modal) { S.modal[el.dataset.mcheck] = el.checked; renderModal(); return; }
  if (el.dataset.path && !S.composing) onFieldInput(el);
});

document.addEventListener('change', function(e) {
  var el = e.target;
  if (el.tagName === 'SELECT' && el.dataset.path) {
    setPath(S.model, el.dataset.path, el.value);
    touchModel(true);
    render();
  }
});

document.addEventListener('toggle', function(e) {
  var el = e.target;
  if (el.dataset && el.dataset.fold) S.ui[el.dataset.fold] = el.open;
}, true);

document.addEventListener('compositionstart', function() { S.composing = true; });
document.addEventListener('compositionend', function(e) {
  S.composing = false;
  if (e.target.dataset && e.target.dataset.path) onFieldInput(e.target);
});

document.addEventListener('keydown', function(e) {
  var el = e.target;
  if (el.dataset && el.dataset.vkey && e.key === 'Enter' && !e.isComposing) { confirmVault(); return; }
  if (e.key === 'Escape' && S.vault) { onVaultAct('v-cancel'); return; }
  if (e.key === 'Escape' && S.modal) { closeModal(); return; }
  if (e.key === 'Enter' && el.tagName === 'INPUT' && el.dataset.path && !e.isComposing) el.blur();
});

// 失焦时补交未保存内容；若宿主在编辑期间推送过数据，等焦点离开卡片后再重绘。
document.addEventListener('focusout', function(e) {
  var el = e.target;
  if (!(el.dataset && el.dataset.path)) return;
  flushSave();
  // 稍作延迟，避免重绘替换掉用户正要点击的按钮。
  setTimeout(function() {
    if (S.deferredRender && !isEditing()) {
      render();
      if (S.modal) renderModal();
      if (S.vault && S.vault.stage === 'open') renderVault();
    }
  }, 250);
});

document.addEventListener('click', function(e) {
  var target = e.target;
  if (target.id === 'modal') { closeModal(); return; }
  if (target.id === 'vault' && S.vault && S.vault.stage !== 'open') { onVaultAct('v-cancel'); return; }
  var actEl = target.closest('[data-act]');
  if (!actEl || actEl.disabled) return;
  var act = actEl.dataset.act;
  var d = actEl.dataset;
  if (act.indexOf('m-') === 0) { if (S.modal) onModalAct(act, d); return; }
  if (act.indexOf('v-') === 0) { if (S.vault) onVaultAct(act); return; }
  if (act === 'vault') { openVault(); return; }
  if (act === 'tab') { flushSave(); S.tab = d.tab; render(); return; }
  if (act === 'roll') { openRoll(d.quality); return; }
  if (act === 'qa-pip') { clickQaPip(d.quality, Number(d.index)); return; }
  if (act === 'qa-max') { stepQaMax(d.quality, Number(d.delta)); return; }
  if (act === 'rest') { if (confirmClick('rest')) restAll(); else render(); return; }
  if (act === 'cmd') { sendCommand(d.cmd); toast('已发送 ' + d.cmd); return; }
  if (act === 'root-step') { setRoot(d.key, Math.max(toInt(d.min, 0), rootNum(d.key) + Number(d.delta)), true); render(); return; }
  if (act === 'record-step') {
    S.model.record[d.key] = Math.max(0, S.model.record[d.key] + Number(d.delta));
    touchModel(true);
    render();
    return;
  }
  if (act === 'conn-pip') {
    var rel = S.model.relationships[Number(d.index)];
    var v = Number(d.value);
    rel.connection = v === rel.connection ? v - 1 : v;
    touchModel(true);
    render();
    return;
  }
  if (act === 'cell') {
    var lane = S.model.tracks[d.track][d.lane];
    var i = Number(d.index);
    lane[i] = (lane[i] + 1) % 3;
    touchModel(true);
    render();
    return;
  }
  if (act === 'list-add') {
    S.model[d.list].push(d.list === 'anomalies' ? blankAnomaly() : blankRelation());
    touchModel(true);
    render();
    return;
  }
  if (act === 'list-remove') {
    var key = (d.list === 'anomalies' ? 'anomaly-' : 'relation-') + d.index;
    if (confirmClick(key)) {
      S.model[d.list].splice(Number(d.index), 1);
      touchModel(true);
    }
    render();
    return;
  }
});

document.addEventListener('visibilitychange', function() { if (document.hidden) flushSave(); });
window.addEventListener('pagehide', flushSave);

window.sealchat.onUpdate(onHostUpdate);
</script>
