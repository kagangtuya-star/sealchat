<!DOCTYPE html>
<!-- sealchat-shinobigami-template:v2 -->
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="application/json" data-sealchat-template-manifest>
  {
    "version": 1,
    "sheetType": "shinobigami",
    "label": "忍神",
    "integration": {
      "provider": "sealdice",
      "probe": {
        "command": "。sbg h",
        "matchMode": "contains",
        "expected": "忍神掷骰插件",
        "timeoutMs": 5000
      },
      "plugin": {
        "name": "忍神掷骰插件",
        "acquireText": "可在 SealChat 用户群获取"
      }
    }
  }
  </script>
  <style>
    :root {
      /* 和风色彩系统 */
      --bg: #e6e4dc; /* 偏灰暗的和纸背景色 */
      --paper: #f2f0e9; /* 纸张面板色 */
      --paper-strong: #faf9f5; /* 强高光面板 */
      --ink: #1a1714; /* 浓墨 */
      --ink-dim: #6b645b; /* 淡墨 */
      --panel: #1f1b18; /* 漆黑面板 */
      --panel-soft: #38332e;
      --line: #b0a89d;
      --line-strong: #1a1714; /* 边线使用实墨 */
      
      --active: #a61b12; /* 朱砂/暗红 */
      --active-ink: #f0eee6;
      --roll: #731008;
      --roll-ink: #f0eee6;
      --warn: #8a1d13;
      --warn-ink: #fff;
      --muted: #b8b3a7;
      --chip: #e8e6df;
      --taint: #7e6a3c; /* 污秽：旧纸/灰金 */
      --taint-ink: #fff7dc;
      
      --shadow: rgba(26, 23, 20, 0.15);
      
      /* 忍神特化分野颜色（加深处理，仿印泥质感） */
      --cat-0: #ad5307; /* 器术：暗橙 */
      --cat-1: #4a6b22; /* 体术：苔绿 */
      --cat-2: #8f1212; /* 忍术：血红 */
      --cat-3: #8a782e; /* 谋术：枯黄 */
      --cat-4: #1c3d66; /* 战术：靛蓝 */
      --cat-5: #4e356e; /* 妖术：紫黑 */
      
      /* 字体：优先采用明朝体/宋体及楷体，凸显忍法帖质感 */
      --font-main: "Noto Serif SC", "Noto Serif TC", "Noto Serif JP", "Songti SC", "SimSun", serif;
      --font-ui: "STKaiti", "KaiTi", "Kaiti SC", "Noto Serif SC", "Songti SC", serif;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      /* 和纸纹理暗花 */
      background-image:
        linear-gradient(90deg, rgba(26,23,20,0.04) 1px, transparent 1px),
        linear-gradient(rgba(26,23,20,0.04) 1px, transparent 1px);
      background-size: 24px 24px;
      background-position: center;
      color: var(--ink);
      font-family: var(--font-main);
      min-height: 100vh;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }

    body {
      padding: 16px;
    }

    textarea,
    .matrix-scroll {
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    ::-webkit-scrollbar-track,
    ::-webkit-scrollbar-corner {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 0;
    }

    body:hover::-webkit-scrollbar-thumb,
    textarea:hover::-webkit-scrollbar-thumb,
    .matrix-scroll:hover::-webkit-scrollbar-thumb {
      background: var(--ink-dim);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--ink);
    }

    button,
    input,
    textarea {
      font: inherit;
      outline: none;
    }

    button {
      border: 0;
      background: none;
      cursor: pointer;
      color: inherit;
    }

    #app {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sheet {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 具有TRPG实物风格的硬朗卡片基类 */
    .summary, .matrix-tools, .section-card {
      background: var(--paper);
      border: 2px solid var(--line-strong);
      border-radius: 0;
      box-shadow: 4px 4px 0 rgba(26, 23, 20, 0.1);
    }

    .summary {
      padding: 14px 16px;
    }

    .summary__top,
    .summary__bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    
    .summary__bottom {
      margin-top: 12px;
    }

    .summary__name {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      position: relative;
      padding-left: 14px;
    }

    /* 角色名前方的朱砂红线装饰 */
    .summary__name::before {
      content: '';
      position: absolute;
      left: 0;
      top: 10%;
      height: 80%;
      width: 4px;
      background: var(--active);
    }

    .summary__avatar {
      width: 48px;
      height: 48px;
      border-radius: 0;
      object-fit: cover;
      border: 2px solid var(--line-strong);
      background: var(--paper-strong);
    }

    .summary__identity {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .summary__chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* 刻印风格芯片标签 */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 0;
      background: var(--paper-strong);
      border: 1px solid var(--line-strong);
      font-family: var(--font-ui);
      font-size: 13px;
      line-height: 1.2;
      box-shadow: 1px 1px 0 rgba(26, 23, 20, 0.2);
      transition: all 0.1s ease;
    }

    .chip--danger {
      background: rgba(166, 27, 18, 0.08);
      border-color: var(--active);
      color: var(--active);
      font-weight: bold;
    }

    .chip--taint {
      background: rgba(126, 106, 60, 0.12);
      border-color: var(--taint);
      color: var(--taint);
      font-weight: bold;
    }

    .chip--toggle:hover {
      transform: translate(-1px, -1px);
      box-shadow: 2px 2px 0 rgba(26, 23, 20, 0.2);
    }
    
    .chip--toggle:active {
      transform: translate(1px, 1px);
      box-shadow: 0 0 0 transparent;
    }

    .chip--toggle.is-active {
      background: var(--panel);
      color: #fff;
      border-color: var(--panel);
    }

    /* 生命值计分板 */
    .hp-panel {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-ui);
      padding: 6px 12px;
      background: var(--paper-strong);
      border: 2px solid var(--line-strong);
      border-radius: 0;
      box-shadow: 2px 2px 0 rgba(26, 23, 20, 0.1);
    }

    .hp-panel__value {
      font-size: 24px;
      font-weight: 900;
      font-family: var(--font-main);
      color: var(--active);
      letter-spacing: 2px;
    }

    .hp-panel__meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .summary__stats {
      display: flex;
      align-items: stretch;
      gap: 12px;
      flex-wrap: wrap;
    }

    .plot-panel {
      display: inline-flex;
      flex-direction: column;
      gap: 8px;
      min-width: 200px;
      padding: 6px 12px 10px;
      background: var(--paper-strong);
      border: 2px solid var(--line-strong);
      box-shadow: 2px 2px 0 rgba(26, 23, 20, 0.1);
    }

    .plot-panel__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .plot-panel__value {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 56px;
      min-height: 48px;
      padding: 0 8px;
      font-size: 38px;
      line-height: 1;
      font-weight: 900;
      font-family: var(--font-main);
      color: var(--active);
      letter-spacing: 2px;
    }

    .plot-panel__value.is-reverse {
      color: var(--panel);
    }

    .plot-panel__value.is-empty {
      color: var(--ink-dim);
    }

    .plot-panel__hint {
      font-size: 12px;
      color: var(--ink-dim);
      white-space: nowrap;
    }

    .plot-panel__controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .plot-mini-btn {
      min-width: 28px;
      padding: 2px 7px;
    }

    .plot-mini-btn--reverse.is-active {
      background: var(--panel);
      color: #fff;
      border-color: var(--panel);
    }

    .plot-mini-btn--clear.is-active {
      background: var(--ink-dim);
      color: #fff;
      border-color: var(--ink-dim);
    }

    /* 小功能按钮实体化 */
    .mini-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 0;
      background: var(--paper-strong);
      border: 1px solid var(--line-strong);
      font-size: 12px;
      font-weight: bold;
      font-family: var(--font-ui);
      box-shadow: 1px 1px 0 rgba(26, 23, 20, 0.2);
      transition: all 0.1s ease;
    }

    .mini-btn:hover {
      background: var(--panel);
      color: #fff;
      transform: translate(-1px, -1px);
      box-shadow: 2px 2px 0 rgba(26, 23, 20, 0.3);
    }

    .mini-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 0 0 0 transparent;
    }

    .matrix-shell {
      display: grid;
      grid-template-columns: repeat(6, minmax(118px, 1fr));
      gap: 0;
      align-items: start;
      min-width: 720px;
      border: 2px solid var(--line-strong); /* 整个矩阵外框 */
      background: var(--paper-strong);
      box-shadow: 4px 4px 0 rgba(26, 23, 20, 0.1);
    }

    .matrix-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 8px;
      scrollbar-width: thin;
    }

    .matrix-scroll.is-dragging {
      cursor: grabbing;
      user-select: none;
    }

    /* 矩阵列：取消圆角，改用清晰的列分割 */
    .matrix-col {
      border-right: 1px solid var(--line-strong);
      border-radius: 0;
      overflow: hidden;
      min-width: 0;
      position: relative;
      isolation: isolate;
      background: transparent;
    }
    .matrix-col:last-child {
      border-right: none;
    }

    /* 强损伤列：黑暗沉沦与血印 */
    .matrix-col.is-damaged-strong {
      background: #1c1917;
      border-color: #38332e;
    }

    .matrix-col.is-damaged-strong::before,
    .matrix-col.is-damaged-strong::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 6px;
      pointer-events: none;
      z-index: 4;
      background: linear-gradient(180deg, #570602, #b8160e, #7a0d08);
      box-shadow: 0 0 4px rgba(0,0,0,0.5);
    }

    .matrix-col.is-damaged-strong::before {
      left: 0;
      clip-path: polygon(100% 0, 34% 5%, 78% 12%, 18% 19%, 82% 27%, 22% 36%, 76% 46%, 14% 56%, 84% 66%, 22% 77%, 74% 88%, 16% 96%, 100% 100%, 0 100%, 0 0);
    }

    .matrix-col.is-damaged-strong::after {
      right: 0;
      clip-path: polygon(0 0, 66% 4%, 22% 12%, 84% 20%, 20% 28%, 78% 37%, 16% 46%, 82% 57%, 24% 68%, 80% 79%, 26% 89%, 86% 96%, 0 100%, 100% 100%, 100% 0);
    }

    /* 矩阵表头：黑色木牌质感 */
    .matrix-col__header {
      background: var(--panel);
      color: #fff;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-bottom: 2px solid var(--line-strong);
    }

    .matrix-col__title {
      display: grid;
      grid-template-columns: 14px 1fr 14px;
      align-items: center;
      gap: 0;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 2px;
      font-family: var(--font-main);
    }

    .matrix-col__title span:first-child {
      grid-column: 2;
      justify-self: center;
      text-align: center;
    }

    .matrix-col__title span:last-child {
      grid-column: 3;
      justify-self: end;
      min-width: 10px;
      text-align: right;
    }

    /* 损伤封印血章 */
    .matrix-col__seal-icon {
      grid-column: 3;
      justify-self: end;
      width: 14px;
      height: 14px;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .matrix-col__seal-icon::before {
      content: '';
      width: 12px;
      height: 12px;
      border-radius: 58% 42% 62% 38% / 64% 46% 54% 36%;
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.2) 0 14%, transparent 15%),
                  linear-gradient(180deg, #d82b1c, #8f0800);
      transform: rotate(28deg);
      box-shadow: inset 0 -1px 0 rgba(0,0,0,0.5), 0 0 2px rgba(0,0,0,0.5);
    }

    .matrix-col__seal-icon::after {
      content: '';
      position: absolute;
      width: 2px;
      height: 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.6);
      transform: rotate(28deg) translateX(1px);
    }

    .matrix-col__taint-icon {
      grid-column: 3;
      justify-self: end;
      width: 14px;
      height: 14px;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .matrix-col__taint-icon::before {
      content: '';
      width: 12px;
      height: 10px;
      border-radius: 58% 42% 52% 48% / 62% 42% 58% 38%;
      background: radial-gradient(circle at 32% 28%, rgba(255, 247, 220, 0.65) 0 12%, transparent 13%),
                  linear-gradient(135deg, #b59a55, #67552f);
      transform: rotate(-18deg);
      box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.35), 0 0 2px rgba(0, 0, 0, 0.45);
    }

    .matrix-col__toggles {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* 得意/损伤/污秽按钮（类似和风附笺） */
    .matrix-col__toggle {
      width: 100%;
      min-height: 20px;
      padding: 0 2px;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      border: 1px solid rgba(255,255,255,0.2);
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
      transition: all 0.1s;
    }

    .matrix-col__toggle:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    .matrix-col__toggle.is-active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .matrix-col__toggle--specialty.is-active {
      background: var(--active);
      color: #fff;
      border-color: var(--active);
    }

    /* 污秽只扣生命，不封锁分野；以灰金印记区别于损伤 */
    .matrix-col__toggle--taint.is-active {
      background: var(--taint);
      color: var(--taint-ink);
      border-color: var(--taint);
    }

    .matrix-col.is-tainted {
      background: rgba(126, 106, 60, 0.07);
      border-color: rgba(126, 106, 60, 0.7);
    }

    /* 污秽裂痕：保留文字与特技可读性，只留下纸面裂纹 */
    .matrix-col.is-tainted::before,
    .matrix-col.is-tainted::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 30px;
      pointer-events: none;
      z-index: 4;
      opacity: 0.42;
      background: linear-gradient(90deg, rgba(126, 106, 60, 0.15), rgba(79, 64, 32, 0.7), rgba(126, 106, 60, 0.12));
      filter: drop-shadow(0 0 1px rgba(255, 247, 220, 0.45));
    }

    .matrix-col.is-tainted::before {
      left: 34%;
      clip-path: polygon(
        43% 0, 57% 0, 53% 13%, 83% 22%, 56% 27%,
        78% 38%, 55% 43%, 73% 54%, 49% 61%,
        67% 72%, 45% 80%, 58% 100%, 42% 100%,
        38% 84%, 53% 75%, 36% 63%, 55% 53%,
        39% 44%, 58% 36%, 38% 26%, 49% 16%
      );
    }

    .matrix-col.is-tainted::after {
      right: 26%;
      width: 22px;
      opacity: 0.28;
      clip-path: polygon(
        46% 16%, 58% 16%, 55% 29%, 88% 38%,
        57% 44%, 78% 55%, 54% 61%, 69% 73%,
        45% 82%, 57% 94%, 43% 94%, 38% 79%,
        53% 70%, 37% 59%, 56% 52%, 39% 42%,
        60% 35%, 41% 26%
      );
    }

    .matrix-col.is-tainted .matrix-col__header {
      border-bottom-color: var(--taint);
    }

    .matrix-col__taint-bar {
      min-height: 8px;
      background: repeating-linear-gradient(
        135deg,
        rgba(126, 106, 60, 0.55) 0,
        rgba(126, 106, 60, 0.55) 2px,
        transparent 2px,
        transparent 6px
      );
      border-bottom: 1px solid var(--taint);
    }

    .matrix-col.is-tainted .matrix-col__footer {
      background: rgba(126, 106, 60, 0.08);
      border-top-color: var(--taint);
    }

    .matrix-col__damage-bar {
      min-height: 8px;
      background: repeating-linear-gradient(
        -45deg,
        rgba(166, 27, 18, 0.4) 0,
        rgba(166, 27, 18, 0.4) 2px,
        transparent 2px,
        transparent 6px
      );
      border-bottom: 1px solid var(--panel);
    }

    .matrix-col.is-damaged-strong .matrix-col__header {
      background: #000;
      border-bottom: 2px solid var(--active);
    }

    .matrix-col.is-damaged-strong .matrix-col__toggle {
      background: transparent;
      color: rgba(255,255,255,0.4);
      border-color: rgba(255,255,255,0.1);
    }

    .matrix-col.is-damaged-strong .matrix-col__toggle.is-active {
      background: var(--active);
      color: #fff;
      border-color: var(--active);
    }

    .matrix-grid {
      display: flex;
      flex-direction: column;
    }

    /* 矩阵行 */
    .matrix-row {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) 42px;
      align-items: stretch;
      min-height: 36px;
      border-bottom: 1px solid var(--line);
      background: transparent;
      transition: background 0.1s;
    }

    .matrix-row:nth-child(even) {
      background: rgba(0,0,0,0.03);
    }

    /* 行状态与修饰 */
    .matrix-row.is-active {
      background: rgba(0,0,0,0.05);
    }

    .matrix-row.is-active.category-0 { background: rgba(171, 83, 7, 0.1); border-left: 2px solid var(--cat-0); }
    .matrix-row.is-active.category-1 { background: rgba(74, 107, 34, 0.1); border-left: 2px solid var(--cat-1); }
    .matrix-row.is-active.category-2 { background: rgba(143, 18, 18, 0.08); border-left: 2px solid var(--cat-2); }
    .matrix-row.is-active.category-3 { background: rgba(138, 120, 46, 0.1); border-left: 2px solid var(--cat-3); }
    .matrix-row.is-active.category-4 { background: rgba(28, 61, 102, 0.08); border-left: 2px solid var(--cat-4); }
    .matrix-row.is-active.category-5 { background: rgba(78, 53, 110, 0.08); border-left: 2px solid var(--cat-5); }

    .matrix-row.is-active.category-0 .matrix-row__toggle { color: var(--cat-0); }
    .matrix-row.is-active.category-1 .matrix-row__toggle { color: var(--cat-1); }
    .matrix-row.is-active.category-2 .matrix-row__toggle { color: var(--cat-2); }
    .matrix-row.is-active.category-3 .matrix-row__toggle { color: var(--cat-3); }
    .matrix-row.is-active.category-4 .matrix-row__toggle { color: var(--cat-4); }
    .matrix-row.is-active.category-5 .matrix-row__toggle { color: var(--cat-5); }

    /* 简洁模式色彩适配 */
    .sheet.is-compact .matrix-row.is-active.category-0,
    .sheet.is-compact .matrix-row.is-active.category-1,
    .sheet.is-compact .matrix-row.is-active.category-2,
    .sheet.is-compact .matrix-row.is-active.category-3,
    .sheet.is-compact .matrix-row.is-active.category-4,
    .sheet.is-compact .matrix-row.is-active.category-5 {
      background: rgba(0,0,0,0.06);
      border-left: 2px solid var(--ink);
    }
    .sheet.is-compact .matrix-row.is-active .matrix-row__toggle {
      color: var(--ink);
    }

    /* 黑点（墨迹印记） */
    .matrix-row__toggle {
      border-right: 1px dotted var(--line);
      background: transparent;
      font-family: var(--font-main);
      font-size: 14px;
      color: transparent; /* 未激活时不显示点，虽然逻辑中未输出点 */
    }

    .matrix-row__toggle.is-on {
      background: transparent;
    }

    .matrix-row__name,
    .matrix-row__value {
      min-width: 0;
      text-align: left;
      font-family: var(--font-main);
      transition: all 0.1s;
    }

    .matrix-row__name {
      padding: 0 8px;
      font-size: 15px;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      position: relative;
    }

    .matrix-row__name:hover {
      background: rgba(0,0,0,0.05);
      color: var(--active);
    }

    .matrix-row__value {
      text-align: center;
      font-size: 15px;
      font-weight: 900;
      border-left: 1px dotted var(--line);
      background: transparent;
      position: relative;
    }

    .matrix-row__value:hover {
      background: var(--roll);
      color: var(--roll-ink);
    }

    /* 损伤行的强覆盖感（横线划掉） */
    .matrix-row.is-damaged-strong {
      background: transparent;
      border-bottom: 1px solid #333;
    }

    .matrix-row.is-damaged-strong .matrix-row__toggle {
      border-right-color: #333;
      color: #666;
    }

    .matrix-row.is-damaged-strong .matrix-row__name {
      color: #666;
      text-decoration: line-through; /* 划线作废视觉 */
      opacity: 1;
    }

    .matrix-row.is-damaged-strong .matrix-row__name:hover {
      background: transparent;
      color: var(--active);
    }

    .matrix-row.is-damaged-strong .matrix-row__value {
      color: #888;
      border-left-color: #333;
    }

    .matrix-row.is-damaged-strong .matrix-row__value:hover {
      background: var(--active);
      color: #fff;
    }

    /* 列底难度提示 */
    .matrix-col__footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-top: 1px solid var(--line-strong);
      background: var(--paper-strong);
      font-family: var(--font-ui);
      font-size: 13px;
      color: var(--ink);
    }

    .matrix-col.is-damaged-strong .matrix-col__footer {
      background: #111;
      color: #666;
      border-top-color: #333;
    }

    /* 操作工具栏 */
    .matrix-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      padding: 12px 16px;
      font-family: var(--font-ui);
    }

    .matrix-tools__group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .matrix-tools__group--random {
      margin-left: auto;
    }

    .matrix-tools__group--expanded {
      flex-basis: 100%;
    }

    .matrix-tools__group--help {
      flex-basis: 100%;
    }

    .matrix-tools__collapse {
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    .matrix-tools__collapse:hover {
      color: var(--active);
    }

    .matrix-help-btn {
      width: 24px;
      min-width: 24px;
      min-height: 24px;
      padding: 0;
      border-radius: 0;
      background: var(--paper-strong);
      border: 1px solid var(--line-strong);
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: bold;
      line-height: 1;
      box-shadow: 1px 1px 0 rgba(26,23,20,0.2);
    }

    .matrix-help-btn:hover,
    .matrix-help-btn.is-active {
      background: var(--panel);
      border-color: var(--panel);
      color: #fff;
      transform: translate(-1px, -1px);
      box-shadow: 2px 2px 0 rgba(26,23,20,0.3);
    }

    .matrix-help-text {
      font-size: 13px;
      color: var(--ink-dim);
    }

    .gap-btn {
      min-width: 32px;
    }

    .mini-btn.is-active,
    .gap-btn.is-active {
      background: var(--roll);
      color: var(--roll-ink);
      border-color: var(--roll);
    }

    .gap-summary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 4px 10px;
      border-radius: 0;
      background: var(--paper-strong);
      border: 1px solid var(--line-strong);
      color: var(--ink);
      font-size: 13px;
    }

    .gap-summary.is-muted {
      background: rgba(166, 27, 18, 0.05);
      border-color: var(--active);
      color: var(--active);
    }

    .gap-edge-track {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      border-radius: 0;
      background: var(--paper-strong);
      border: 1px solid var(--line-strong);
    }

    .gap-edge {
      width: 34px;
      min-height: 20px;
      border-radius: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      line-height: 1;
      color: #fff;
      background: rgba(166, 27, 18, 0.8);
      border: 1px solid rgba(0,0,0,0.3);
    }

    .gap-edge.is-open {
      background: rgba(74, 107, 34, 0.8);
      color: #fff;
    }

    /* 损伤角标：低饱和暗色提示 */
    .damage-corner {
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-top: 12px solid rgba(58, 28, 28, 0.48);
      border-left: 14px solid transparent;
      filter: saturate(0.45);
      pointer-events: none;
    }

    /* 栏目区块 (忍法/背景/忍具) */
    .section-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-card {
      overflow: hidden;
    }

    .section-card__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 16px;
      background: var(--panel);
      color: #fff;
      border-bottom: 2px solid var(--line-strong);
    }

    .section-card__title {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 2px;
      font-family: var(--font-main);
    }

    .section-card__actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .section-card__actions .mini-btn {
      min-width: 74px;
      min-height: 30px;
      background: var(--paper);
      border-color: #fff;
      color: var(--ink);
    }

    .section-card__body {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .section-card__body--scroll {
      grid-template-columns: minmax(0, 1fr);
      max-height: 382px;
      overflow-y: auto;
      align-content: start;
    }

    /* 记录槽按钮：和风附笺质感 */
    .slot-btn {
      min-height: 48px;
      padding: 10px 12px;
      border-radius: 0;
      text-align: left;
      background: var(--paper-strong);
      border: 1px solid var(--line);
      box-shadow: 2px 2px 0 rgba(26,23,20,0.05);
      display: flex;
      flex-direction: column;
      gap: 6px;
      justify-content: center;
      transition: all 0.1s;
      position: relative;
    }

    .slot-btn:hover {
      border-color: var(--line-strong);
      background: #fff;
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 rgba(26,23,20,0.1);
    }

    .slot-btn__index {
      font-family: var(--font-ui);
      font-size: 12px;
      color: var(--active);
      font-weight: bold;
      border-bottom: 1px dotted var(--line);
      padding-bottom: 2px;
    }

    .slot-btn__text {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
      font-size: 14px;
      line-height: 1.4;
      min-height: 39px;
      word-break: break-all;
      white-space: normal;
      font-family: var(--font-main);
    }

    .tool-slot .slot-btn__text {
      font-size: 18px;
      font-weight: 900;
      line-height: 1.35;
    }

    .tool-slot {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 118px;
      gap: 10px;
      align-items: stretch;
      min-height: 86px;
    }

    .tool-slot__main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      justify-content: center;
    }

    .tool-slot__count-wrap {
      align-self: stretch;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      padding-left: 10px;
      border-left: 1px dotted var(--line);
      min-height: 100%;
    }

    .tool-slot__meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: var(--ink-dim);
      border-top: 1px dotted var(--line);
      padding-top: 4px;
    }

    .tool-slot__kind {
      font-family: var(--font-ui);
      letter-spacing: 1px;
    }

    .tool-slot__count {
      color: var(--active);
      font-weight: 900;
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 24px;
      line-height: 1;
    }

    .tool-slot__count-label {
      color: var(--active);
      font-weight: 900;
      font-family: var(--font-ui);
      font-size: 12px;
      letter-spacing: 1px;
    }

    .tool-slot__inline-input {
      width: 100%;
      border: 1px solid var(--line-strong);
      background: rgba(255,255,255,0.85);
      padding: 6px 8px;
      font-size: 14px;
      font-family: var(--font-main);
      color: var(--ink);
    }

    .tool-slot__inline-input--count {
      width: 100%;
      text-align: center;
      font-size: 20px;
      font-weight: 900;
      padding: 8px 6px;
    }

    .slot-btn.is-empty .slot-btn__text {
      color: var(--ink-dim);
      font-style: normal;
    }

    .empty-tip {
      padding: 24px 16px;
      text-align: center;
      color: var(--ink-dim);
      background: transparent;
      border: 1px dashed var(--line);
      font-family: var(--font-ui);
    }

    /* 浮窗：压迫感与日式复古弹出窗 */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 20;
    }

    .dialog {
      width: min(480px, 100%);
      background: var(--paper-strong);
      border: 2px solid var(--line-strong);
      border-radius: 0;
      box-shadow: 8px 8px 0 rgba(0,0,0,0.8);
      overflow: hidden;
    }

    .dialog--roll {
      width: min(396px, 100%);
      box-shadow: 5px 5px 0 rgba(0,0,0,0.72);
    }

    .dialog--import {
      display: flex;
      flex-direction: column;
      max-height: calc(100dvh - 32px);
    }

    .dialog--import .dialog__body {
      overflow-y: auto;
      min-height: 0;
      overflow-wrap: anywhere;
    }

    .dialog--import .dialog__header,
    .dialog--import .dialog__footer {
      flex-shrink: 0;
    }

    .import-error {
      color: var(--warn);
    }

    .dialog__header {
      background: var(--panel);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 2px solid var(--line-strong);
    }

    .dialog--roll .dialog__header {
      padding: 8px 10px;
    }

    .dialog__title {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      font-family: var(--font-main);
    }

    .dialog--roll .dialog__title {
      font-size: 15px;
      letter-spacing: 1px;
    }

    .dialog__header .dialog-btn {
      min-height: 28px;
      padding: 0 10px;
      background: transparent;
      border-color: rgba(255,255,255,0.4);
      color: #fff;
    }

    .dialog__header .dialog-btn:hover {
      background: #fff;
      color: var(--ink);
    }

    .dialog__body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .dialog--roll .dialog__body {
      padding: 10px;
      gap: 8px;
    }

    .dialog__footer {
      padding: 0 16px 16px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .dialog--roll .dialog__footer {
      padding: 0 10px 10px;
      gap: 6px;
    }

    .field-label {
      font-family: var(--font-ui);
      font-size: 13px;
      color: var(--ink);
      font-weight: bold;
    }

    /* 输入框：内嵌感 */
    .field-input,
    .field-textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 0;
      background: var(--paper-strong);
      box-shadow: inset 2px 2px 0 rgba(26,23,20,0.05);
      padding: 12px 14px;
      color: var(--ink);
      font-size: 15px;
      font-family: var(--font-main);
      transition: all 0.1s;
    }

    .field-input:focus,
    .field-textarea:focus {
      border-color: var(--active);
      box-shadow: inset 2px 2px 0 rgba(166, 27, 18, 0.1);
    }

    .dialog--roll .field-input {
      padding: 7px 9px;
      font-size: 13px;
    }

    .dialog--roll .field-label {
      font-size: 12px;
      line-height: 1.1;
    }

    .roll-field-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .roll-field-col {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .roll-inline-action {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      align-items: stretch;
    }

    .dialog--roll .roll-inline-action .mini-btn {
      min-width: 68px;
      min-height: 30px;
      padding: 0 10px;
      font-size: 12px;
    }

    .field-textarea {
      min-height: 120px;
      resize: vertical;
    }

    .tool-editor-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 108px;
      gap: 10px;
      align-items: end;
    }

    .tool-editor-grid.is-fixed {
      grid-template-columns: minmax(0, 1fr);
    }

    .tool-editor-readonly {
      padding: 12px 14px;
      border: 1px solid var(--line-strong);
      background: rgba(0,0,0,0.03);
      font-size: 15px;
      color: var(--ink);
    }

    .modifier-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .dialog--roll .modifier-grid {
      gap: 6px;
    }

    .dialog--roll .modifier-btn--full {
      grid-column: 1 / -1;
    }

    .modifier-btn {
      min-height: 36px;
      border-radius: 0;
      border: 1px solid var(--line-strong);
      background: var(--paper-strong);
      font-family: var(--font-main);
      font-size: 15px;
      font-weight: 900;
      box-shadow: 2px 2px 0 rgba(26,23,20,0.1);
      transition: all 0.1s;
    }

    .dialog--roll .modifier-btn {
      min-height: 28px;
      font-size: 13px;
      box-shadow: 1px 1px 0 rgba(26,23,20,0.1);
    }

    .modifier-btn.is-active,
    .modifier-btn:hover {
      background: var(--roll);
      color: var(--roll-ink);
      border-color: var(--roll);
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 rgba(26,23,20,0.2);
    }

    .modifier-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 0 0 0 transparent;
    }

    .formula-preview {
      border-radius: 0;
      padding: 12px 14px;
      background: rgba(0,0,0,0.03);
      border: 1px dashed var(--line-strong);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-all;
      color: var(--ink);
    }

    .dialog--roll .formula-preview {
      padding: 7px 9px;
      font-size: 12px;
      line-height: 1.3;
    }

    .dialog-btn {
      min-height: 36px;
      padding: 0 18px;
      border-radius: 0;
      background: var(--paper-strong);
      border: 1px solid var(--line-strong);
      font-family: var(--font-main);
      font-size: 14px;
      font-weight: 900;
      box-shadow: 2px 2px 0 rgba(26,23,20,0.15);
      transition: all 0.1s;
    }

    .dialog--roll .dialog-btn {
      min-height: 28px;
      padding: 0 12px;
      font-size: 12px;
      box-shadow: 1px 1px 0 rgba(26,23,20,0.15);
    }
    
    .dialog-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 rgba(26,23,20,0.25);
    }

    .dialog-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 0 0 0 transparent;
    }

    .dialog-btn--primary {
      background: var(--active);
      border-color: var(--active);
      color: #fff;
    }

    /* 移动端/窄屏响应式修饰 */
    .sheet.is-narrow-layout .matrix-scroll {
      padding-bottom: 8px;
      scrollbar-color: var(--line) transparent;
      cursor: grab;
    }

    .sheet.is-narrow-layout .matrix-scroll::-webkit-scrollbar {
      height: 6px;
    }

    .sheet.is-narrow-layout .matrix-scroll::-webkit-scrollbar-thumb {
      background: var(--line);
    }

    .sheet.is-narrow-layout .matrix-row {
      grid-template-columns: 20px minmax(54px, 1fr) 36px;
    }

    .sheet.is-narrow-layout .matrix-row__name {
      padding: 0 4px;
      font-size: 14px;
    }

    .sheet.is-narrow-layout .matrix-row__value {
      font-size: 14px;
    }

    .sheet.is-narrow-layout .section-card__body {
      grid-template-columns: minmax(0, 1fr);
    }

    .sheet.is-narrow-layout .section-card__body--scroll {
      max-height: 320px;
    }

    .sheet.is-narrow-layout .tool-editor-grid,
    .sheet.is-narrow-layout .tool-editor-grid.is-fixed {
      grid-template-columns: minmax(0, 1fr);
    }

    .sheet.is-narrow-layout .summary__top,
    .sheet.is-narrow-layout .summary__bottom,
    .sheet.is-narrow-layout .matrix-tools {
      align-items: stretch;
    }

    @media (max-width: 720px) {
      body {
        padding: 10px;
      }

      .summary__name {
        font-size: 20px;
      }

      .matrix-scroll {
        padding-bottom: 8px;
        scrollbar-color: var(--line) transparent;
        cursor: grab;
      }

      .matrix-scroll::-webkit-scrollbar {
        height: 6px;
      }

      .matrix-scroll::-webkit-scrollbar-thumb {
        background: var(--line);
      }

      .matrix-row {
        grid-template-columns: 20px minmax(54px, 1fr) 36px;
      }

      .matrix-row__name {
        padding: 0 4px;
        font-size: 14px;
      }

      .matrix-row__value {
        font-size: 14px;
      }

      .modifier-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .section-card__body {
        grid-template-columns: minmax(0, 1fr);
      }

      .summary__top,
      .summary__bottom,
      .matrix-tools {
        align-items: stretch;
      }
    }
  </style>
</head>

  <div id="app"></div>
  <input id="xlsxImportInput" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" aria-label="导入 Excel 人物卡" hidden>

      return doc;

    function readXlsxXml(part) {
      // 分块限制解压内容，避免小体积压缩文件占用过多内存。
      return new Promise(function (resolve, reject) {
        var chunks = [];
        var length = 0;
        var stream = part.internalStream('string');
        stream.on('data', function (chunk) {
          length += chunk.length;

            return;
          }
          chunks.push(chunk);
        }).on('error', reject).on('end', function () {
          try {
            resolve(parseXml(chunks.join('')));
          } catch (error) {
            reject(error);
          }
        }).resume();
      });
    }

    async function readCharacterSheet(file) {
      if (!file || !/\.xlsx$/i.test(file.name)) throw new Error('请选择 .xlsx 人物卡（不支持 .xls）');
      if (file.size > 5 * 1024 * 1024) throw new Error('人物卡文件不能超过 5 MB');
      var zip = await JSZip.loadAsync(await file.arrayBuffer());
      var workbookPart = zip.file('xl/workbook.xml');
      if (!workbookPart) throw new Error('不是有效的 Excel 工作簿');
      var workbook = await readXlsxXml(workbookPart);
      var sheet = Array.from(workbook.getElementsByTagNameNS('*', 'sheet')).find(function (item) {
        return item.getAttribute('name') === '自动人物卡';
      });
      if (!sheet) throw new Error('未找到「自动人物卡」工作表');
      var relId = sheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
      var relPart = zip.file('xl/_rels/workbook.xml.rels');
      if (!relPart) throw new Error('工作簿缺少工作表索引');
      var relDoc = await readXlsxXml(relPart);
      var rel = Array.from(relDoc.getElementsByTagNameNS('*', 'Relationship')).find(function (item) {
        return item.getAttribute('Id') === relId;
      });
      if (!rel || !rel.getAttribute('Target') || rel.getAttribute('TargetMode') === 'External') {
        throw new Error('无法定位「自动人物卡」工作表');
      }
      var sheetUrl = new URL(rel.getAttribute('Target'), 'https://xlsx.invalid/xl/workbook.xml');
      var sheetPath = sheetUrl.pathname.slice(1);
      if (sheetUrl.origin !== 'https://xlsx.invalid' || sheetPath.indexOf('xl/') !== 0) {
        throw new Error('工作表路径无效');
      }
      var sheetPart = zip.file(sheetPath);
      if (!sheetPart) throw new Error('无法读取「自动人物卡」工作表');
      var shared = [];
      var sharedPart = zip.file('xl/sharedStrings.xml');
      if (sharedPart) {
        var sharedDoc = await readXlsxXml(sharedPart);
        shared = Array.from(sharedDoc.getElementsByTagNameNS('*', 'si')).map(function (item) {
          return Array.from(item.getElementsByTagNameNS('*', 't')).map(function (node) {
            return node.textContent;
          }).join('');
        });
      }
      var doc = await readXlsxXml(sheetPart);
      var cells = Object.create(null);
      Array.from(doc.getElementsByTagNameNS('*', 'c')).forEach(function (cell) {
        var valueNode = xmlFirst(cell, 'v');
        var inlineNode = xmlFirst(cell, 'is');
        if (cell.getAttribute('t') === 'e' || (xmlFirst(cell, 'f') && !valueNode)) {
          // 辅助区域可能含有空行查找错误，只在读取导入字段时报告。
          cells[cell.getAttribute('r')] = new Error('导入字段存在错误或未计算的单元格，请在 Excel 中重新计算并保存后导入');
          return;
        }
        var value = valueNode ? valueNode.textContent : '';
        if (inlineNode) {
          value = Array.from(inlineNode.getElementsByTagNameNS('*', 't')).map(function (node) {
            return node.textContent;
          }).join('');
        }
        if (cell.getAttribute('t') === 's') value = shared[Number(value)] || '';
        cells[cell.getAttribute('r')] = value;
      });
      return cells;
    }

    function cellText(cells, ref) {

      meta.slots.ninpo = normalizeSlotArray(ninpo, SLOT_CONFIG.ninpo.count);
      meta.slots.background = normalizeSlotArray(background, SLOT_CONFIG.background.count);

        warnings: [

        event.target.value = '';
        if (file) loadXlsxImport(file);
      }
    });

    document.addEventListener('mousedown', beginMatrixDragScroll);
    document.addEventListener('mousemove', updateMatrixDragScroll);
    document.addEventListener('mouseup', endMatrixDragScroll);

    document.addEventListener('click', function (event) {
      if (state.dragScroll.suppressClick) {
        state.dragScroll.suppressClick = false;
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      var target = event.target;
      while (target && target !== document.body) {
        if (target.dataset && target.dataset.dialogPanel === '1') {
          return;
        }
        if (target.dataset && target.dataset.action) {
          var action = target.dataset.action;
          if (action === 'choose-xlsx') {
            var input = document.getElementById('xlsxImportInput');
            if (input) { input.value = ''; input.click(); }
            return;
          }
          if (action === 'confirm-xlsx-import') { confirmXlsxImport(); return; }
          if (action === 'cancel-xlsx-import') { cancelXlsxImport(); return; }
          if (action === 'toggle-specialty') {
            (function (category) {
              applyMetaMutation(function (meta) {
                meta.specialtySwitches[category] = meta.specialtySwitches[category] ? 0 : 1;
              });
            })(target.dataset.category);
            return;
          }
          if (action === 'toggle-damage') {
            (function (category) {
              applyMetaMutation(function (meta) {
                meta.damageSwitches[category] = meta.damageSwitches[category] ? 0 : 1;
                if (meta.damageSwitches[category]) {
                  meta.taintSwitches[category] = 0;
                }
              });
            })(target.dataset.category);
            return;
          }
          if (action === 'toggle-taint') {
            (function (category) {
              applyMetaMutation(function (meta) {
                meta.taintSwitches[category] = meta.taintSwitches[category] ? 0 : 1;
                if (meta.taintSwitches[category]) {
                  meta.damageSwitches[category] = 0;
                }
              });
            })(target.dataset.category);
            return;
          }
          if (action === 'toggle-connectivity') {
            (function (key) {
              applyMetaMutation(function (meta) {
                meta.connectivity[key] = meta.connectivity[key] ? 0 : 1;
                if (key === 'leftRight' && !meta.connectivity[key]) {
                  meta.manualGaps[5] = 0;
                }
              });
            })(target.dataset.key);
            return;
          }
          if (action === 'toggle-matrix-tools') {
            state.matrixToolsExpanded = !state.matrixToolsExpanded;
            render();
            return;
          }
          if (action === 'toggle-gap') {
            (function (gapKey) {
              applyMetaMutation(function (meta) {
                var numericGap = toInteger(gapKey, -1);
                var maxGap = meta.connectivity.leftRight ? GAP_PAIRS.length : GAP_PAIRS.length - 1;
                if (numericGap < 0 || numericGap > maxGap) return;
                meta.manualGaps[String(numericGap)] = meta.manualGaps[String(numericGap)] ? 0 : 1;
              });
            })(target.dataset.gap);
            return;
          }
          if (action === 'toggle-skill') {
            (function (skill) {
              applyMetaMutation(function (meta) {
                meta.skillSwitches[skill] = meta.skillSwitches[skill] ? 0 : 1;
              });
            })(target.dataset.skill);
            return;
          }
          if (action === 'open-roll') {
            openRollDialog(target.dataset.skill, toInteger(target.dataset.targetValue, 12));
            return;
          }
          if (action === 'open-random-category') {
            openRandomDialog('category');
            return;
          }
          if (action === 'open-random-skill') {
            openRandomDialog('skill');
            return;
          }
          if (action === 'set-random-category') {
            state.randomDialog.category = target.dataset.category || '';
            render();
            return;
          }
          if (action === 'confirm-random') {
            confirmRandomDialog();
            return;
          }
          if (action === 'close-random') {
            closeRandomDialog();
            return;
          }
          if (action === 'set-plot') {
            applyPlotValuePatch(target.dataset.plot);
            return;
          }
          if (action === 'set-roll-modifier') {
            state.rollDialog.modifier = target.dataset.modifier || '';
            render();
            return;
          }
          if (action === 'set-roll-extra-dice') {
            state.rollDialog.extraDice = target.dataset.extraDice || '';
            render();
            return;
          }
          if (action === 'confirm-roll') {
            confirmRollDialog();
            return;
          }
          if (action === 'close-roll') {
            closeRollDialog();
            return;
          }
          if (action === 'edit-number') {
            var key = target.dataset.key;
            openEditorDialog('number', key, state.attrs[key] == null ? '' : state.attrs[key], { key: key });
            return;
          }
          if (action === 'edit-slot') {
            var group = target.dataset.group;
            var index = toInteger(target.dataset.index, -1);
            if (group && index >= 0) {
              openEditorDialog('slot', SLOT_CONFIG[group].label + ' ' + (index + 1), state.meta.slots[group][index], { group: group, index: index });
            }
            return;
          }
          if (action === 'confirm-editor') {
            confirmEditorDialog();
            return;
          }
          if (action === 'close-editor') {
            closeEditorDialog();
            return;
          }
          if (action === 'toggle-section') {
            var section = target.dataset.section;
            state.sectionUi[section].collapsed = !state.sectionUi[section].collapsed;
            render();
            return;
          }
          if (action === 'toggle-locale') {
            applyMetaMutation(function (meta) {
              meta.locale = meta.locale === 'zh-Hant' ? 'zh-Hans' : 'zh-Hant';
            });
            return;
          }
              if (action === 'toggle-compact-mode') {
                applyMetaMutation(function (meta) {
                  meta.compactMode = meta.compactMode ? 0 : 1;
                });
                return;
              }
              if (action === 'toggle-matrix-hint') {
                state.helpUi.matrixHintOpen = !state.helpUi.matrixHintOpen;
                render();
                return;
              }
            }
            target = target.parentElement;
          }
    });

    document.addEventListener('dblclick', function (event) {
      var target = event.target;
      if (!target || !target.closest) return;
      var plotDisplay = target.closest('[data-plot-display]');
      if (plotDisplay) {
        var meta = normalizeMeta(state.meta || state.attrs[SHINOBI_META_KEY]);
        openEditorDialog('plot', '谋位', getPlotEditorValue(meta.plotValue));
        return;
      }
      var toolSlot = target.closest('[data-tool-kind]');
      if (!toolSlot) return;
      var toolKind = toolSlot.dataset.toolKind;
      var toolIndex = toInteger(toolSlot.dataset.index, -1);
      var toolSlots = normalizeToolSlots(state.meta && state.meta.slots ? state.meta.slots.tool : null);
      var toolEntry = null;
      if (toolKind === 'fixed' && toolIndex >= 0 && toolIndex < toolSlots.fixed.length) {
        toolEntry = toolSlots.fixed[toolIndex];
      } else if (toolKind === 'custom' && toolIndex >= 0 && toolIndex < toolSlots.custom.length) {
        toolEntry = toolSlots.custom[toolIndex];
      }
      if (!toolEntry) return;
      openToolInlineEditor(toolKind, toolIndex, toolEntry);
    });

    document.addEventListener('touchend', function (event) {
      var target = event.target;
      if (!target || !target.closest) return;
      if (target.closest('input, textarea, select, option')) return;
      var toolSlot = target.closest('[data-tool-kind]');
      if (!toolSlot) return;
      var toolKind = toolSlot.dataset.toolKind;
      var toolIndex = toInteger(toolSlot.dataset.index, -1);
      var now = Date.now();
      var isSameSlot = state.touchToolEdit.kind === toolKind && state.touchToolEdit.index === toolIndex;
      if (isSameSlot && now - state.touchToolEdit.time <= 360) {
        state.touchToolEdit.time = 0;
        state.touchToolEdit.kind = '';
        state.touchToolEdit.index = -1;
        var toolSlots = normalizeToolSlots(state.meta && state.meta.slots ? state.meta.slots.tool : null);
        var toolEntry = null;
        if (toolKind === 'fixed' && toolIndex >= 0 && toolIndex < toolSlots.fixed.length) {
          toolEntry = toolSlots.fixed[toolIndex];
        } else if (toolKind === 'custom' && toolIndex >= 0 && toolIndex < toolSlots.custom.length) {
          toolEntry = toolSlots.custom[toolIndex];
        }
        if (!toolEntry) return;
        openToolInlineEditor(toolKind, toolIndex, toolEntry);
        return;
      }
      state.touchToolEdit.time = now;
      state.touchToolEdit.kind = toolKind;
      state.touchToolEdit.index = toolIndex;
    });

    document.addEventListener('scroll', function (event) {
      var body = event.target;
      if (!body || !body.dataset) return;
      if (body.classList && body.classList.contains('matrix-scroll')) {
        state.matrixScrollLeft = body.scrollLeft;
        return;
      }
      var sectionKey = body.dataset.sectionBody;
      if (!sectionKey) return;
      state.sectionScrollTop[sectionKey] = body.scrollTop;
    }, true);

    document.addEventListener('focusout', function (event) {
      var target = event.target;
      if (!target || (target.id !== 'toolInlineNameInput' && target.id !== 'toolInlineCountInput')) return;
      window.setTimeout(function () {
        var active = document.activeElement;
        if (active && (active.id === 'toolInlineNameInput' || active.id === 'toolInlineCountInput')) return;
        confirmToolInlineEditor();
      }, 0);
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        if (state.importLoading || state.importCandidate || state.importError) {
          cancelXlsxImport();
          return;
        }
        if (state.rollDialog.open) {
          closeRollDialog();
          return;
        }
        if (state.randomDialog.open) {
          closeRandomDialog();
          return;
        }
        if (state.toolInlineEditor.open) {
          closeToolInlineEditor();
          return;
        }
        if (state.editorDialog.open) {
          closeEditorDialog();
          return;
        }
      }
      if (event.key === 'Enter' && state.toolInlineEditor.open) {
        event.preventDefault();
        confirmToolInlineEditor();
        return;
      }
      if (event.key === 'Enter' && !event.shiftKey && state.editorDialog.open && state.editorDialog.kind !== 'slot') {
        event.preventDefault();
        confirmEditorDialog();
      }
    });

    window.addEventListener('blur', endMatrixDragScroll);
    window.addEventListener('resize', syncResponsiveLayout);

    sealchat.onUpdate(function (data) {
      var attrs = data && data.attrs && typeof data.attrs === 'object' ? data.attrs : {};
      if (state.pendingPatch && attrsContainsPatch(attrs, state.pendingPatch)) {
        state.pendingPatch = null;
        state.pendingPatchHash = '';
      }
      state.name = data && data.name ? data.name : '';
      state.avatarUrl = data && data.avatarUrl ? data.avatarUrl : '';
      state.attrs = attrs;
      state.meta = normalizeMeta(attrs[SHINOBI_META_KEY]);
      if (state.pendingPatch && state.pendingPatch[SHINOBI_META_KEY]) {
        state.meta = normalizeMeta(state.pendingPatch[SHINOBI_META_KEY]);
      }
      state.lastIncomingHash = stableStringify(attrs);
      render();
      var derivedPatch = state.pendingPatch && state.pendingPatch[SHINOBI_META_KEY] ? {} : buildDerivedPatch(attrs);
      if (Object.keys(derivedPatch).length > 0) {
        sendPatch(derivedPatch);
      }
    });
  </script>
</body>
</html>
